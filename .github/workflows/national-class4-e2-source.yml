name: NATIONAL Class 4 E2 - Trusted Host Source
on:
  pull_request:
    branches: [stage3/class4-six-owner-reciprocal-20261121]
    paths:
      - packages/engine/src/GameRunner.ts
      - packages/engine/src/configuration/EngineConfig.ts
      - src/server/GameServer.ts
      - src/server/national/TrustedNationalMatch.ts
      - tests/national/TrustedNationalServerAuthority.test.ts
      - .github/workflows/national-class4-e2-source.yml

permissions:
  contents: read

jobs:
  trusted-national-source:
    name: Typecheck + real GameRunner auth test + targeted format
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - run: npm run typecheck
      - run: npx --no-install vitest run --project node tests/national/TrustedNationalServerAuthority.test.ts
      - run: npx --no-install oxlint src/server/national/TrustedNationalMatch.ts packages/engine/src/GameRunner.ts packages/engine/src/configuration/EngineConfig.ts src/server/GameServer.ts tests/national/TrustedNationalServerAuthority.test.ts
      - run: npx --no-install oxfmt --check src/server/national/TrustedNationalMatch.ts packages/engine/src/GameRunner.ts packages/engine/src/configuration/EngineConfig.ts src/server/GameServer.ts tests/national/TrustedNationalServerAuthority.test.ts
