name: NATIONAL C5 E3 — Empire WAR Policy Acceptance

on:
  push:
    branches:
      - feature/c5-class1-e3-imperial-war-policy-20261122
  pull_request:
    branches:
      - stage3/conductor5-class1-integration-20261122
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c5-e3-war-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Exact detached SHA checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
      - name: Assert evidence commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "SOURCE_SHA=$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - name: Typecheck full workspace
        run: npm run typecheck
      - name: C5 WAR-08 GameRunner + accepted WAR-12 predecessor regressions
        if: success() || failure()
        run: |
          npx --no-install vitest run --project node \
            tests/national/C5ImperialWarPolicy.test.ts \
            tests/national/ConductorTwoCrownWarContinuity.test.ts \
            tests/national/LiveSovereignty.test.ts \
            tests/national/RoundEightWarInFlight.test.ts
      - name: Report preexisting contradictory legacy expectations (non-gating)
        if: success() || failure()
        continue-on-error: true
        run: |
          # Legacy SOV-06 expects extinct empire WAR to stay live (conflicts
          # with the accepted #147 retirement); separate legacy E3/E4 fixture
          # expects public coalition names hidden although D-017 publishes
          # coalition rosters. Preserve failure and never claim it passed.
          npx --no-install vitest run --project node \
            tests/national/LiveWarPoliticalState.test.ts
      - name: Lint full workspace
        if: success() || failure()
        run: npm run lint
      - name: Format exact changed C5 files
        if: success() || failure()
        run: |
          npx --no-install oxfmt --check \
            packages/engine/src/national/politics/sovereignty.ts \
            packages/engine/src/national/politics/PoliticalAuthorityAdapter.ts \
            packages/engine/src/national/NationalRuntime.ts \
            packages/engine/src/national/conflict/WarLedger.ts \
            packages/engine/src/national/politics/NationalWarState.ts \
            packages/engine/src/game/GameImpl.ts \
            packages/engine/src/execution/NationalWarExecution.ts \
            packages/engine-api/src/Schemas.ts \
            tests/national/C5ImperialWarPolicy.test.ts
