name: C5 Class Two — conductor end-to-end commercial policy preflight
on:
  push:
    branches:
      - stage3/conductor5-class2-integration-20261122
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authenticated-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - name: Workspace TypeScript
        run: npm run typecheck
      - name: Real native imperial policy reader and negative packet tests
        run: npx --no-install vitest run --project node tests/national/C4NativeImperialGate.test.ts
      - name: Actual emperor UI dispatch through canonical policy intent schema
        run: npx --no-install vitest run tests/ui/national/NationalDiplomacyPanel.test.ts
      - name: Exact pinned formatting
        run: |
          npx --no-install oxfmt --check \
            packages/engine-api/src/game/NationalImperialView.ts \
            packages/engine/src/national/observation/NationalPactProjection.ts \
            src/client/NationalImperialState.ts \
            src/client/NationalDiplomacyPanel.ts \
            tests/national/C4NativeImperialGate.test.ts \
            tests/ui/national/NationalDiplomacyPanel.test.ts
      - name: Full static lint
        run: npm run lint
      - name: Production build
        run: npm run build-prod
