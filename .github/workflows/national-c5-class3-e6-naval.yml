name: C5 Class Three E6 - exact-head lawful naval AI
on:
  push:
    branches:
      - feature/c5-class3-e6-lawful-national-naval-ai-20261122
  pull_request:
    branches:
      - stage3/conductor5-class3-integration-20261122
  workflow_dispatch:
permissions:
  contents: read
jobs:
  national-naval-ai:
    name: Exact SHA typecheck, naval gameplay, format, lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
      - name: Verify actual PR/commit head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "C5_CLASS3_E6_SOURCE_SHA=$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - name: Whole-project TypeScript
        run: npm run typecheck
      - name: Real naval AI, maritime and FFA regression
        if: success() || failure()
        run: |
          npx --no-install vitest run --project node             tests/national/C5Class3NavalAI.test.ts             tests/national/C4Class2EconomicMaritime.test.ts             tests/national/NationalAIRealWar.test.ts             tests/NationWarshipNukeReserve.test.ts             tests/Warship.test.ts             tests/national/C5CoastalVisibility.test.ts
      - name: Lint
        if: success() || failure()
        run: npm run lint
      - name: Touched formatter
        if: success() || failure()
        run: |
          npx --no-install oxfmt --check             packages/engine/src/national/ai/NationalNavalStrategy.ts             packages/engine/src/execution/nation/NationWarshipBehavior.ts             packages/engine/src/execution/NationExecution.ts             tests/national/C5Class3NavalAI.test.ts
      - name: Production build
        if: success() || failure()
        run: npm run build-prod
