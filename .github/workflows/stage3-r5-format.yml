name: Stage 3 R5 One-Shot Original Scorecard and Handoff Formatter
on:
  push:
    branches:
      - stage3/integration-20261115
    paths:
      - .github/workflows/stage3-r5-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3/integration-20261115
          fetch-depth: 0
          persist-credentials: true
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - name: Apply exact pinned repository formatter
        shell: bash
        run: |
          set -euo pipefail
          npm exec -- oxfmt --write \
            docs/21-progress-of-project.md \
            docs/23-stage3-round5-integration.md \
            prompts/ENGINEER_1_ROUND_5.md \
            prompts/ENGINEER_2_ROUND_5.md \
            prompts/ENGINEER_3_ROUND_5.md \
            prompts/ENGINEER_4_ROUND_5.md \
            prompts/ENGINEER_5_ROUND_5.md
          npm run format:check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/21-progress-of-project.md \
            docs/23-stage3-round5-integration.md \
            prompts/ENGINEER_1_ROUND_5.md \
            prompts/ENGINEER_2_ROUND_5.md \
            prompts/ENGINEER_3_ROUND_5.md \
            prompts/ENGINEER_4_ROUND_5.md \
            prompts/ENGINEER_5_ROUND_5.md
          if ! git diff --cached --quiet; then
            git commit -m "style(R5): format original milestone weights and five-engineer handoff"
            git push origin HEAD:refs/heads/stage3/integration-20261115
          fi
