name: C2 E4 one-shot real projection WebGL source acceptance
on:
  push:
    branches:
      - feature/c2-class1-e4-playable-projection-ui-20261121
permissions:
  contents: write
jobs:
  projection-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci --ignore-scripts
      - name: Enforce pinned format
        run: |
          npx --no-install oxfmt --write src/client/TrustedNationalSession.ts src/client/ClientGameRunner.ts src/client/Transport.ts src/client/view/GameView.ts src/client/view/PlayerView.ts src/client/NationalDiplomacyPanel.ts tests/ui/national/TrustedNationalProjectionMapC2.test.ts
          npm run format:check
          git diff --check
      - name: Full TypeScript, lint and E4/E3 regression suites
        run: |
          npm run typecheck
          npm run lint
          npx --no-install vitest run tests/ui/national/TrustedNationalProjectionMapC2.test.ts tests/ui/national/NationalPrivatePanelClass5.test.ts tests/ui/national/NationalPrivateCapabilityClass5.test.ts tests/ui/national/NationalPoliticalControlsR11.test.ts tests/ui/national/NationalDiplomacyPanel.test.ts tests/national/NationalAccessionPacketsR11.test.ts tests/ui/national/NationalHumanMapInputR11.test.ts
      - name: Commit formatted source and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c2-e4-playable-projection-verify-once.yml
          git add src/client/TrustedNationalSession.ts src/client/ClientGameRunner.ts src/client/Transport.ts src/client/view/GameView.ts src/client/view/PlayerView.ts src/client/NationalDiplomacyPanel.ts tests/ui/national/TrustedNationalProjectionMapC2.test.ts
          git diff --cached --check
          git commit -m "feat(national): verify projection-driven WebGL and native player input"
          git push origin HEAD:refs/heads/feature/c2-class1-e4-playable-projection-ui-20261121
