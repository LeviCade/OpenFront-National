name: Stage 3 R4 One-Shot Handoff Formatting
on:
  push:
    branches:
      - stage3/integration-20261115
    paths:
      - .github/workflows/stage3-r4-final-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout active integration
        uses: actions/checkout@v4
        with:
          ref: stage3/integration-20261115
          fetch-depth: 0
          persist-credentials: true
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Install pinned npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Install locked dependencies
        run: npm run inst
      - name: Apply pinned formatter to R4 instructions and progress ledger
        shell: bash
        run: |
          set -euo pipefail
          npm exec -- oxfmt --write \
            docs/21-progress-of-project.md \
            docs/22-stage3-round4-integration.md \
            prompts/ENGINEER_1_ROUND_4.md \
            prompts/ENGINEER_2_ROUND_4.md \
            prompts/ENGINEER_3_ROUND_4.md \
            prompts/ENGINEER_4_ROUND_4.md \
            prompts/ENGINEER_5_ROUND_4.md
          npm run format:check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/21-progress-of-project.md \
            docs/22-stage3-round4-integration.md \
            prompts/ENGINEER_1_ROUND_4.md \
            prompts/ENGINEER_2_ROUND_4.md \
            prompts/ENGINEER_3_ROUND_4.md \
            prompts/ENGINEER_4_ROUND_4.md \
            prompts/ENGINEER_5_ROUND_4.md
          if ! git diff --cached --quiet; then
            git commit -m "style(stage3 R4): format progress scorecard and five-engineer orders"
            git push origin HEAD:refs/heads/stage3/integration-20261115
          fi
