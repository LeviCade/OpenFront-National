name: C5 C2 pinned AI fixture formatter diagnostic
on:
  push:
    branches: [stage3/conductor5-class2-integration-20261122]
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - run: |
          set -euo pipefail
          npx --no-install oxfmt --write tests/national/C5AIPoliticalGame.test.ts
          echo FIXTURE-DIFF-BEGIN
          git diff --no-ext-diff -- tests/national/C5AIPoliticalGame.test.ts
          echo FIXTURE-DIFF-END
