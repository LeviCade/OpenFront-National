name: C6 C1 E3 — enforced embargo restitution
on:
  push:
    branches:
      - feature/c6-class1-e3-embargo-settlement-20261123
  pull_request:
    branches:
      - stage3/conductor6-class1-integration-20261123
permissions:
  contents: read
concurrency:
  group: c6-c1-e3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-restitution:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: false
      - name: Verify exact checkout
        env:
          CHECKOUT_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$CHECKOUT_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - name: Actual Game embargo settlement, hosted and negative controls
        run: npx --no-install vitest run --project node tests/national/C6Class1E3EmbargoRestitution.test.ts tests/national/C5Class3E3ImperialTrade.test.ts
      - name: Existing economy and WAR regressions
        if: success() || failure()
        run: >-
          npx --no-install vitest run --project node
          tests/national/C4Class2EconomicMaritime.test.ts
          tests/national/C4Class2EconomicIngress.test.ts
          tests/national/LiveSovereignty.test.ts
          tests/core/executions/TradeShipExecution.test.ts
          tests/core/executions/TrainExecution.test.ts
      - name: Typecheck
        if: success() || failure()
        run: npm run typecheck
      - name: Format modified source
        if: success() || failure()
        run: >-
          npx --no-install oxfmt --check
          packages/engine-api/src/Schemas.ts
          packages/engine/src/execution/ExecutionManager.ts
          packages/engine/src/execution/NationalSanctionExecution.ts
          tests/national/C6Class1E3EmbargoRestitution.test.ts
          docs/engineering/c6-class1-e3-embargo-restitution.md
      - name: Lint
        if: success() || failure()
        run: npm run lint
      - name: Format all
        if: success() || failure()
        run: npm run format:check
      - name: Production build
        if: success() || failure()
        run: npm run build-prod
      - name: Full test suite
        if: success()
        run: npm test
