name: C5 Third Class — Exact Integrated Development Acceptance
on:
  push:
    branches:
      - stage3/conductor5-class3-integration-20261122
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c5-class3-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full-source:
    name: C5 C3 exact SHA — ${{ matrix.gate }}
    strategy:
      fail-fast: false
      matrix:
        gate: [typecheck, all-tests, lint, pinned-format, production-build]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Assert source identity (no synthetic PR merge)
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - name: Execute complete independent development gate
        shell: bash
        env:
          GATE: ${{ matrix.gate }}
        run: |
          set -euo pipefail
          case "$GATE" in
            typecheck) npm run typecheck ;;
            all-tests) npm test ;;
            lint) npm run lint ;;
            pinned-format) npm run format:check ;;
            production-build) npm run build-prod ;;
            *) echo "unknown gate" >&2; exit 1 ;;
          esac
  distinct-naval-war-recon:
    name: C5 C3 current behavioral baseline
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Source identity
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - name: Run accepted Game-owned policy and recon contracts
        run: |
          npx --no-install vitest run --project node \
            tests/national/C5Class2FundedRecon.test.ts \
            tests/national/C5Class2ImperialUltimatum.test.ts \
            tests/national/C5StandingImperialDefense.test.ts \
            tests/national/C5Class2E6Coercion.test.ts \
            tests/national/C4Class2EconomicMaritime.test.ts
          npx --no-install vitest run tests/ui/national/NationalReconPurchase.test.ts
