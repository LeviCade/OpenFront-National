name: C5 final-action — pinned formatter correction
on:
  push:
    branches:
      - stage3/conductor5-class1-integration-20261122
permissions:
  contents: write
jobs:
  format-once:
    if: "${{ !contains(github.event.head_commit.message, '[c5-pinned-format]') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Pin exact Conductor-controlled staging
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/stage3/conductor5-class1-integration-20261122"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - name: Apply exact pinned formatter and commit tracked changes only
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install oxfmt --write
          git diff --check
          git add -u
          if git diff --cached --quiet; then
            echo "ALREADY_FORMATTED=1" >> "$GITHUB_ENV"
          else
            git -c user.name="C5 Format Witness" -c user.email="c5-format-witness@users.noreply.github.com" -c core.hooksPath=/dev/null commit -m "[c5-pinned-format] exact oxfmt correction only"
          fi
      - name: Publish only the resulting formatting correction onto SAME staging branch
        if: "${{ env.ALREADY_FORMATTED != '1' }}"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/stage3/conductor5-class1-integration-20261122"
          test "$(git show -s --format=%s HEAD)" = "[c5-pinned-format] exact oxfmt correction only"
          authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" push origin HEAD:refs/heads/stage3/conductor5-class1-integration-20261122
