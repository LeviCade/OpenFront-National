name: NATIONAL R9 — targeted four-suite integration repair

on:
  push:
    branches:
      - stage3/round9-combined-acceptance-20261121
    paths:
      - .github/workflows/r9-one-time-four-regressions.yml

permissions:
  contents: write

concurrency:
  group: national-r9-targeted-four-regressions
  cancel-in-progress: false

jobs:
  verify-and-finish:
    if: github.repository == 'LeviCade/OpenFront-National' && github.actor == 'LeviCade'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Pin dependencies and format only four changed suites
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts npm@12.1.0
          npm run inst
          npm exec -- oxfmt --write \
            tests/national/LiveWarExecutionRound5.test.ts \
            tests/national/RoundEightWarRequestId.test.ts \
            tests/national/NationalWarPublicProjectionR9.test.ts \
            tests/ui/national/NationalWarWire.test.ts
      - name: Full typecheck and exact affected source regressions
        run: |
          set -euo pipefail
          npm run typecheck
          npm exec -- vitest run --project node \
            tests/national/LiveWarExecutionRound5.test.ts \
            tests/national/RoundEightWarRequestId.test.ts \
            tests/national/NationalWarPublicProjectionR9.test.ts \
            tests/ui/national/NationalWarWire.test.ts
      - name: Commit verified source, remove this temporary workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/r9-one-time-four-regressions.yml
          git add \
            tests/national/LiveWarExecutionRound5.test.ts \
            tests/national/RoundEightWarRequestId.test.ts \
            tests/national/NationalWarPublicProjectionR9.test.ts \
            tests/ui/national/NationalWarWire.test.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(stage3): accept E1/E2/E3/E4 targeted real WAR and diplomacy regressions"
          git push origin HEAD:refs/heads/stage3/round9-combined-acceptance-20261121
