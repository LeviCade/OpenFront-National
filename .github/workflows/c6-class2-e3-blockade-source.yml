name: C6 C2 E3 — blockade and embargo exact source
on:
  push:
    branches:
      - feature/conductor6-class2-e3-blockade-and-embargo-20261123
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        gate: [focused, typecheck, lint, format, build, full]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: false
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - name: Execute gate
        env:
          GATE: ${{ matrix.gate }}
        run: |
          case "$GATE" in
            focused) npx --no-install vitest run --project node tests/national/C6C2E3Blockade.test.ts tests/national/C6Class1E3EmbargoRestitution.test.ts tests/national/C6Class1E3SettlementIngress.test.ts tests/national/C5Class3E3ImperialTrade.test.ts tests/national/C4Class2EconomicMaritime.test.ts tests/national/C6Class1NavalEscort.test.ts ;;
            typecheck) npm run typecheck ;;
            lint) npm run lint ;;
            format) npm run format:check ;;
            build) npm run build-prod ;;
            full) npm test ;;
          esac
