name: Sixth Conductor Second Class - Charter Formatter Diagnostics

on:
  push:
    branches:
      - stage3/conductor6-class2-integration-20261123

permissions:
  contents: read

jobs:
  exact-charter-formatter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - name: Produce exact pinned oxfmt patch without hiding any discrepancy
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          npx --no-install oxfmt --write docs/release/NATIONAL_SIXTH_CONDUCTOR_SECOND_CLASS_CHARTER.md
          echo C6_C2_CHARTER_FORMAT_DIAGNOSTIC_BEGIN
          git -c color.ui=false diff -- docs/release/NATIONAL_SIXTH_CONDUCTOR_SECOND_CLASS_CHARTER.md
          echo C6_C2_CHARTER_FORMAT_DIAGNOSTIC_END
