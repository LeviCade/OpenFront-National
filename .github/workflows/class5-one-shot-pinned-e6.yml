name: "Class 5 one-shot pinned E6 formatter"
on:
  push:
    branches:
      - stage3/class5-six-owner-acceptance-20261121
    paths:
      - .github/workflows/class5-one-shot-pinned-e6.yml
permissions:
  contents: write
jobs:
  format:
    if: ${{ startsWith(github.event.head_commit.message, 'ci(class5)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact source-pinned oxfmt
        run: |
          npm install -g --ignore-scripts npm@12.1.0
          npm ci --ignore-scripts
      - name: Format only E6 owned files and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/stage3/class5-six-owner-acceptance-20261121)"
          npx --no-install oxfmt --write scripts/national-gpu-ci/skybot-host-witness.mjs scripts/national-gpu-ci/skybot-host-witness.test.mjs
          npx --no-install oxfmt --check scripts/national-gpu-ci/skybot-host-witness.mjs scripts/national-gpu-ci/skybot-host-witness.test.mjs
          git add -- scripts/national-gpu-ci/skybot-host-witness.mjs scripts/national-gpu-ci/skybot-host-witness.test.mjs
          git rm -- .github/workflows/class5-one-shot-pinned-e6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --name-only
          git commit -m "fix(class5): pinned-format Skybot host witness and remove temporary workflow"
          git push origin HEAD:refs/heads/stage3/class5-six-owner-acceptance-20261121
