name: C5 Class 3 E3 — actual imperial trade acceptance
on:
  push:
    branches:
      - feature/c5-class3-e3-empire-member-trade-override-20261122
  pull_request:
    branches:
      - stage3/conductor5-class3-integration-20261122
permissions:
  contents: read
concurrency:
  group: c5-c3-e3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-economic-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: false
      - name: Verify exact checked-out code
        env:
          CHECKOUT_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$CHECKOUT_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - name: Five-nation actual maritime, rail, crown and replay
        run: npx --no-install vitest run --project node tests/national/C5Class3E3ImperialTrade.test.ts
      - name: Prior accepted economic / sovereignty regressions
        if: success() || failure()
        run: >-
          npx --no-install vitest run --project node
          tests/national/C4Class2EconomicMaritime.test.ts
          tests/national/C4Class2EconomicIngress.test.ts
          tests/national/LiveSovereignty.test.ts
          tests/core/executions/TradeShipExecution.test.ts
          tests/core/executions/TrainExecution.test.ts
      - name: Full source types
        if: success() || failure()
        run: npm run typecheck
      - name: Touched-source formatter
        if: success() || failure()
        run: >-
          npx --no-install oxfmt --check
          packages/engine-api/src/Schemas.ts
          packages/engine/src/national/NationalRuntime.ts
          packages/engine/src/game/Game.ts
          packages/engine/src/game/GameImpl.ts
          packages/engine/src/execution/NationalSanctionExecution.ts
          tests/national/C5Class3E3ImperialTrade.test.ts
      - name: Output remaining formatter delta
        if: success() || failure()
        run: |
          npx --no-install oxfmt --write packages/engine/src/national/NationalRuntime.ts
          git diff -- packages/engine/src/national/NationalRuntime.ts
      - name: Lint
        if: success() || failure()
        run: npm run lint
      - name: Production build
        if: success() || failure()
        run: npm run build-prod
