name: NATIONAL E4 R8 — one-time pinned formatting

on:
  push:
    branches: [feature/r8-e4-player-operated-diplomacy]
    paths:
      - ".github/workflows/national-r8-e4-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r8-e4-player-operated-diplomacy
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - name: Run repository-pinned oxfmt on only E4-owned changed files
        run: |
          set -euo pipefail
          ./node_modules/.bin/oxfmt --write src/client/NationalDiplomacyPanel.ts tests/ui/national/NationalWarWire.test.ts
          ./node_modules/.bin/oxfmt --check src/client/NationalDiplomacyPanel.ts tests/ui/national/NationalWarWire.test.ts
          git diff --stat
      - name: Push formatter-only E4 changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- src/client/NationalDiplomacyPanel.ts tests/ui/national/NationalWarWire.test.ts; then
            git add src/client/NationalDiplomacyPanel.ts tests/ui/national/NationalWarWire.test.ts
            git commit -m "style(r8 e4): apply pinned oxfmt to diplomacy source and tests"
            git push origin HEAD:refs/heads/feature/r8-e4-player-operated-diplomacy
          fi
