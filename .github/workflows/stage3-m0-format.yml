name: Stage 3 M0 - Temporary Formatter

on:
  push:
    branches:
      - stage3/integration-20261115
    paths:
      - .github/workflows/stage3-m0-format.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: national-stage3-m0-format
  cancel-in-progress: false

jobs:
  format:
    if: github.repository == 'LeviCade/OpenFront-National'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: stage3/integration-20261115
          fetch-depth: 0
          persist-credentials: true
          submodules: false
      - name: Install pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Install pinned npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Install lockfile dependencies
        run: npm run inst
      - name: Format M0 implementation, tests and integration contract
        shell: bash
        run: |
          set -euo pipefail
          npm exec -- oxfmt --write \
            packages/engine-api/src/Schemas.ts \
            packages/engine/src/configuration/EngineConfig.ts \
            packages/engine/src/game/Game.ts \
            packages/engine/src/game/GameImpl.ts \
            packages/engine/src/execution/WinCheckExecution.ts \
            packages/engine/src/execution/ExecutionManager.ts \
            packages/engine/src/execution/NationalFoundEmpireExecution.ts \
            packages/engine/src/snapshot/ExecutionRegistry.ts \
            packages/engine/src/national/NationalRuntime.ts \
            src/client/SinglePlayerModal.ts \
            tests/national/M0Engine.test.ts \
            docs/19-stage3-m0-interface.md
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/engine-api/src/Schemas.ts \
            packages/engine/src/configuration/EngineConfig.ts \
            packages/engine/src/game/Game.ts \
            packages/engine/src/game/GameImpl.ts \
            packages/engine/src/execution/WinCheckExecution.ts \
            packages/engine/src/execution/ExecutionManager.ts \
            packages/engine/src/execution/NationalFoundEmpireExecution.ts \
            packages/engine/src/snapshot/ExecutionRegistry.ts \
            packages/engine/src/national/NationalRuntime.ts \
            src/client/SinglePlayerModal.ts \
            tests/national/M0Engine.test.ts \
            docs/19-stage3-m0-interface.md
          if ! git diff --cached --quiet; then
            git commit -m "style(stage3 M0): run repository formatter on executable integration slice"
            git push origin HEAD:refs/heads/stage3/integration-20261115
          fi
