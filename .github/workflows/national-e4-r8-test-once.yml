name: NATIONAL E4 R8 — targeted UI acceptance (final)

on:
  push:
    branches: [feature/r8-e4-player-operated-diplomacy]
    paths:
      - ".github/workflows/national-e4-r8-test-once.yml"

permissions:
  contents: write

jobs:
  e4-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r8-e4-player-operated-diplomacy
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - name: Validate exact player-to-transport UI contract tests
        run: |
          set -euo pipefail
          npm exec -- vitest run --project node tests/ui/national/NationalWarWire.test.ts tests/ui/national/NationalDiplomacyPanel.test.ts tests/ui/national/NationalFoundingWire.test.ts
      - name: Check pinned source format and apply E4-only correction
        if: always()
        run: |
          set -euo pipefail
          ./node_modules/.bin/oxfmt --write tests/ui/national/NationalDiplomacyPanel.test.ts tests/ui/national/NationalWarWire.test.ts
          ./node_modules/.bin/oxfmt --check src/client/NationalDiplomacyPanel.ts src/client/NationalDiplomacyState.ts src/client/Transport.ts tests/ui/national/NationalDiplomacyPanel.test.ts tests/ui/national/NationalWarWire.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- tests/ui/national/NationalDiplomacyPanel.test.ts tests/ui/national/NationalWarWire.test.ts; then
            git add tests/ui/national/NationalDiplomacyPanel.test.ts tests/ui/national/NationalWarWire.test.ts
            git commit -m "style(r8 e4): apply pinned oxfmt after targeted regression repairs"
            git push origin HEAD:refs/heads/feature/r8-e4-player-operated-diplomacy
          fi
