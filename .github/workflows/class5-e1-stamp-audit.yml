name: Class Five E1 trusted stamp audit
on:
  push:
    branches: [tooling/class5-e1-stamp-audit-20261121]
permissions:
  contents: read
jobs:
  e1:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned tools
        run: |
          npm install -g npm@12.1.0
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Real server principal tests and legacy regression
        run: npx --no-install vitest run tests/national/ClassFiveStampedExecutionChain.test.ts tests/national/ClassFourTrustedHostAuthority.test.ts tests/national/TrustedNationalServerAuthority.test.ts --reporter=verbose
      - name: Typecheck all workspace TS projects
        if: always()
        run: npm run typecheck
      - name: Exact pinned E1 formatter patch
        if: always()
        shell: bash
        run: |
          npx --no-install oxfmt --write packages/engine/src/game/GameImpl.ts tests/national/ClassFiveStampedExecutionChain.test.ts
          git diff -- packages/engine/src/game/GameImpl.ts tests/national/ClassFiveStampedExecutionChain.test.ts
