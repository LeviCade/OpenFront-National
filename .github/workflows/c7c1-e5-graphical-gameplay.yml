name: C7 Class 1 E5 graphical gameplay
on:
  push:
    branches:
      - stage3/c7c1-e5-graphical-acceptance
      - stage3/conductor7-class1-integration-20261125
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        gate: [focused, regression, typecheck, lint, formatting, production]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm install --global --ignore-scripts npm@12.1.0
          test "$(node -v)" = v24.15.0
          test "$(npm -v)" = 12.1.0
          npm run inst
      - name: Exact-head acceptance
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.gate }}" in
            focused)
              node --check scripts/national-qa/browser-gameplay.mjs
              node --check scripts/national-qa/browser-c7-owner-run.mjs
              node --test scripts/national-qa/browser-c7-owner-verdict.check.mjs scripts/national-gpu-ci/owner-functional-witness.check.mjs scripts/national-gpu-ci/verify-workflow.mjs
              npx --no-install vitest run tests/qa/national/RoundTenSoloSelection.test.mjs tests/qa/national/RoundElevenBrowserActions.test.mjs tests/ui/national/C6C2E6Victory.test.ts
              ;;
            regression) npm test ;;
            typecheck) npm run typecheck ;;
            lint) npm run lint ;;
            formatting)
              npm run format:check || {
                npx --no-install oxfmt --write scripts/national-qa/browser-c7-owner-run.mjs scripts/national-qa/browser-c7-owner-verdict.check.mjs scripts/national-qa/browser-c7-owner-verdict.mjs scripts/national-qa/browser-gameplay.mjs src/client/components/GameConfigSettings.ts
                git diff --no-color -- scripts/national-qa/browser-c7-owner-run.mjs scripts/national-qa/browser-c7-owner-verdict.check.mjs scripts/national-qa/browser-c7-owner-verdict.mjs scripts/national-qa/browser-gameplay.mjs src/client/components/GameConfigSettings.ts
                exit 1
              }
              ;;
            production) npm run build-prod ;;
          esac
  owner-functional:
    # Only the repository owner can launch this workload on an authorized ref.
    # No PR trigger, no fork, no other self-hosted runner or signed-release bypass.
    if: >-
      github.repository == 'LeviCade/OpenFront-National' &&
      github.actor == 'LeviCade' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/stage3/c7c1-e5-graphical-acceptance' ||
      github.ref == 'refs/heads/stage3/conductor7-class1-integration-20261125')
    runs-on: skybot-ci-gpu
    timeout-minutes: 55
    concurrency:
      group: national-c7c1-e5-owner-functional
      cancel-in-progress: false
    env:
      CHROME_BIN: /opt/skybot-gpu-runtime/chrome-headless-shell-linux64/chrome-headless-shell
      NATIONAL_CHROME_ANGLE_BACKEND: gl-egl
      EGL_PLATFORM: surfaceless
      NATIONAL_REQUIRE_HARDWARE_GPU: "0"
      NATIONAL_QA_SOFTWARE_CDP: "0"
      NATIONAL_GPU_CANDIDATE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify owner-only exact source and existing disposable GPU
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = LeviCade/OpenFront-National
          test "$GITHUB_ACTOR" = LeviCade
          case "$GITHUB_REF" in
            refs/heads/stage3/c7c1-e5-graphical-acceptance|refs/heads/stage3/conductor7-class1-integration-20261125) ;;
            *) exit 1 ;;
          esac
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test "$(id -u)" -ne 0
          test -x "$CHROME_BIN"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$NATIONAL_GPU_CANDIDATE_SHA" = "$GITHUB_SHA"
          git merge-base --is-ancestor 00673dce1ff61c61e44b026e6bd8c7a92f642ff8 "$GITHUB_SHA"
          test "$(git ls-remote --exit-code origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Pinned install once
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts npm@12.1.0
          test "$(node -v)" = v24.15.0
          test "$(npm -v)" = 12.1.0
          npm run inst
          node --test scripts/national-qa/browser-c7-owner-verdict.check.mjs scripts/national-gpu-ci/verify-workflow.mjs
      - name: Observe four real modes and actual terminal results
        run: node scripts/national-qa/browser-c7-owner-run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c7c1-e5-owner-functional-${{ github.run_id }}-${{ github.run_attempt }}
          path: national-qa-artifacts/c7-owner-functional/
          retention-days: 7
          if-no-files-found: warn
