name: C2 E3 real private observer map and fog source acceptance
on:
  push:
    branches:
      - feature/c2-class1-e3-private-observer-contract-20261121
    paths:
      - .github/workflows/c2-e3-observer-qa.yml
permissions:
  contents: read
jobs:
  c2-e3:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Pinned npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Pinned install
        run: npm run inst
      - name: Capture exact pinned E3 source format
        shell: bash
        run: |
          files=(
            packages/engine/src/national/observation/NationalObserverMap.ts
            packages/engine/src/national/observation/NationalServerOutbound.ts
            src/server/national/NationalRecipientWire.ts
            tests/national/C2PrivateObserverMapWire.test.ts
          )
          npx --no-install oxfmt --write "${files[@]}"
          for f in "${files[@]}"; do
            echo "C2E3_SOURCE_BEGIN:$f"
            base64 -w0 "$f"
            echo
            echo "C2E3_SOURCE_END:$f"
          done
      - name: Whole-source typecheck
        run: npm run typecheck
      - name: Real A/B/C GameRunner, encoded socket FOG and existing regression suites
        run: npx --no-install vitest run --project node tests/national/C2PrivateObserverMapWire.test.ts tests/national/NationalGeographicFogR8.test.ts tests/national/ClassFivePrincipalWireFanout.test.ts tests/national/ClassFiveTrustedLobbyTransport.test.ts tests/national/NationalServerOutboundClass4.test.ts tests/national/NationalAccessionPacketsR11.test.ts
      - name: Full source lint
        run: npm run lint
