name: NATIONAL E2 R9 exact-head war source acceptance

on:
  push:
    branches:
      - stage3/e2-round8-war-levy-conservation-20261117
    paths:
      - .github/workflows/national-e2-r9-exact-source.yml

permissions:
  contents: read

jobs:
  war-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Pinned npm version
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Pinned dependency install
        run: npm run inst
      - name: Verify tracked diff
        run: git diff --check
      - name: Pinned formatter (fail fast)
        run: npm run format:check
      - name: Full TypeScript gate
        run: npm run typecheck
      - name: Spawned WAR, NAVY, MIRV, MDA, request and outcome tests
        run: ./node_modules/.bin/vitest run --project node tests/national/RoundEightWarInFlight.test.ts tests/national/RoundEightLevyOverlap.test.ts tests/national/RoundEightWarRequestId.test.ts tests/national/RoundNineWarOutcomeRouting.test.ts
      - name: Full source tests (one run)
        run: npm test
      - name: Full source lint
        run: npm run lint
      - name: Production build
        run: npm run build-prod
      - name: Report exact source commit
        run: git rev-parse HEAD
