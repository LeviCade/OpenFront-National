name: C4 Class 2 E6 — exact hardware admission source
on:
  push:
    branches: [feature/c4-class2-e6-physical-execution-20261122]
  pull_request:
    branches: [stage3/conductor4-class2-integration-20261122]
permissions:
  contents: read
jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "SOURCE_SHA=$EXPECTED_SHA"
      - name: Test exact run grant and hardware workflow contract
        run: |
          node --check scripts/national-gpu-ci/skybot-host-witness.mjs
          node --test scripts/national-gpu-ci/host-run-grant.check.mjs scripts/national-gpu-ci/verify-workflow.mjs
          bash -n scripts/national-gpu-ci/run-four-modes.sh
          echo 'SOURCE_ONLY; no GPU or signing authority exercised'
