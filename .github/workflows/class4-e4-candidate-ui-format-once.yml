name: Class Four E4 one-time candidate UI validation
on:
  push:
    branches:
      - feature/class4-e4-reciprocal-ui-20261121
permissions:
  contents: write
jobs:
  candidate-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci --ignore-scripts
      - name: Pinned complete-file oxfmt and check
        run: |
          set -euo pipefail
          npx --no-install oxfmt --write src/client/NationalDiplomacyPanel.ts tests/ui/national/NationalPoliticalControlsR11.test.ts
          npx --no-install oxfmt --check src/client/NationalDiplomacyPanel.ts tests/ui/national/NationalPoliticalControlsR11.test.ts docs/release/NATIONAL_R11_E4_CLASS3_PLAYER_JOURNEY.md
          git diff --check
      - name: Typecheck and cross-owner E3/E4 tests
        run: |
          set -euo pipefail
          npm run typecheck
          npx --no-install vitest run tests/national/NationalAccessionPacketsR11.test.ts tests/ui/national/NationalPoliticalControlsR11.test.ts tests/ui/national/NationalHumanMapInputR11.test.ts tests/ui/national/NationalDiplomacyPanel.test.ts
      - name: Commit formatted code and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/class4-e4-candidate-ui-format-once.yml
          git add src/client/NationalDiplomacyPanel.ts tests/ui/national/NationalPoliticalControlsR11.test.ts
          git diff --cached --check
          git commit -m "feat(national): make candidate-initiated accession human operable"
          git push origin HEAD:refs/heads/feature/class4-e4-reciprocal-ui-20261121
