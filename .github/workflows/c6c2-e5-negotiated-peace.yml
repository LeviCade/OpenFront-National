name: C6C2 E5 — negotiated peace exact-head source
on:
  push:
    branches:
      - feature/conductor6-class2-e5-negotiated-peace-ai-20261123
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Verify exact revision
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - run: npm run typecheck
      - name: Focused actual Game and authority controls
        if: ${{ !cancelled() }}
        run: npx --no-install vitest run --project node tests/national/C6C2E5Peace.test.ts tests/national/RoundEightWarInFlight.test.ts tests/national/RoundElevenImperialPeaceDelegation.test.ts tests/national/NationalAIRealWar.test.ts
      - run: npm test
        if: ${{ !cancelled() }}
      - run: npm run lint
        if: ${{ !cancelled() }}
      - run: npm run format:check
        if: ${{ !cancelled() }}
      - run: npm run build-prod
        if: ${{ !cancelled() }}
