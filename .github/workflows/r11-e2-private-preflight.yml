name: R11 E2 Private Match — Exact Pinned Formatter and Focused Tests
on:
  push:
    branches:
      - feature/r11-e2-foundation-combat-20261121
    paths:
      - .github/workflows/r11-e2-private-preflight.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Install pinned toolchain once
        run: |
          npm install --global --ignore-scripts npm@12.1.0
          npm run inst
      - name: Print exact pinned formatter output for single E2 test path
        run: |
          npx --no-install oxfmt --write tests/national/RoundElevenPrivateMatchSessions.test.ts
          git diff --check
          node -e "const fs=require('node:fs'); console.log('R11_E2_PRIVATE_FORMATTED='+JSON.stringify(fs.readFileSync('tests/national/RoundElevenPrivateMatchSessions.test.ts','utf8')))"
      - name: Source typecheck
        run: npm run typecheck
      - name: Real private-session, server-config and prior E2 GameRunner
        run: |
          npx --no-install vitest run --project node \
            tests/national/RoundElevenPrivateMatchSessions.test.ts \
            tests/server/ConfigPatch.test.ts \
            tests/national/RoundElevenFoundationCombat.test.ts \
            tests/national/RoundElevenDelegatedPeaceWire.test.ts
