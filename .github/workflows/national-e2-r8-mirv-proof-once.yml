name: NATIONAL E2 R8 MIRV and complete source attestation
on:
  push:
    branches: [stage3/e2-round8-war-levy-conservation-20261117]
    paths: [.github/workflows/national-e2-r8-mirv-proof-once.yml]
permissions:
  contents: write
jobs:
  full-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3/e2-round8-war-levy-conservation-20261117
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Pin npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Install locked dependencies
        run: npm run inst
      - name: Pinned formatter exact two-file MIRV patch
        shell: bash
        run: |
          set -euo pipefail
          files=(packages/engine/src/execution/MIRVExecution.ts tests/national/RoundEightWarInFlight.test.ts)
          ./node_modules/.bin/oxfmt --write "${files[@]}"
          ./node_modules/.bin/oxfmt --check "${files[@]}"
          git diff --check
      - name: Commit only E2 MIRV source/tests and remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- packages/engine/src/execution/MIRVExecution.ts tests/national/RoundEightWarInFlight.test.ts
          rm .github/workflows/national-e2-r8-mirv-proof-once.yml
          git add -u -- .github/workflows/national-e2-r8-mirv-proof-once.yml
          git commit -m "style(national): pinned MIRV flight authorization formatting"
          git push origin HEAD:refs/heads/stage3/e2-round8-war-levy-conservation-20261117
          echo "MIRV_VERIFIED_SHA=$(git rev-parse HEAD)"
      - name: Full repository TypeScript
        run: npm run typecheck
      - name: WAR 09-12, MIRV, MDA and authenticated request IDs
        run: ./node_modules/.bin/vitest run --project node tests/national/RoundEightWarInFlight.test.ts tests/national/RoundEightLevyOverlap.test.ts tests/national/RoundEightWarRequestId.test.ts
      - name: Full Vitest suite
        run: npm test
      - name: Full lint
        run: npm run lint
      - name: Full pinned format gate
        run: npm run format:check
      - name: Production build
        run: npm run build-prod
