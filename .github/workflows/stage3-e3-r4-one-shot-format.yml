name: Stage 3 E3 R4 One-Shot Branch Formatting
on:
  push:
    branches:
      - stage3/e3-round4-persisted-intelligence-20261116
    paths:
      - .github/workflows/stage3-e3-r4-one-shot-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout E3 Round Four
        uses: actions/checkout@v4
        with:
          ref: stage3/e3-round4-persisted-intelligence-20261116
          fetch-depth: 0
          persist-credentials: true
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Install pinned npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Install pinned dependencies
        run: npm run inst
      - name: Format only Engineer Three owned files
        shell: bash
        run: |
          set -euo pipefail
          npm exec -- oxfmt --write \
            packages/engine/src/execution/NationExecution.ts \
            packages/engine/src/national/observation/LiveObservation.ts \
            packages/engine/src/national/observation/NationalOutbound.ts \
            tests/national/NationalLiveObservation.test.ts
          npm run format:check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/engine/src/execution/NationExecution.ts \
            packages/engine/src/national/observation/LiveObservation.ts \
            packages/engine/src/national/observation/NationalOutbound.ts \
            tests/national/NationalLiveObservation.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(national): apply pinned formatter to E3 intelligence files"
            git push origin HEAD:refs/heads/stage3/e3-round4-persisted-intelligence-20261116
          fi
