name: R11 E4 pinned Class Three UI status validation
on:
  push:
    branches:
      - feature/r11-e4-format-once-20261121
permissions:
  contents: read
jobs:
  e4-formatter:
    name: Format only E4 founding-status paths and run focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci --ignore-scripts
      - name: Pinned format, byte capture, typecheck and E4 focused tests
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install oxfmt --write src/client/NationalDiplomacyPanel.ts tests/ui/national/NationalDiplomacyPanel.test.ts
          python3 - <<'PY'
          import base64
          for key, path in [
              ("PANEL", "src/client/NationalDiplomacyPanel.ts"),
              ("TEST", "tests/ui/national/NationalDiplomacyPanel.test.ts"),
          ]:
              with open(path,"rb") as f:
                  print("E4_CLASS3_" + key + "=" + base64.b64encode(f.read()).decode("ascii"))
          PY
          npm run typecheck
          npx --no-install vitest run tests/ui/national/NationalDiplomacyPanel.test.ts tests/ui/national/NationalPoliticalControlsR11.test.ts tests/ui/national/NationalHumanMapInputR11.test.ts
          git diff --check
