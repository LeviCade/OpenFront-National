name: C5 Class Two E6 — normalize owned source
on:
  push:
    branches:
      - feature/c5-class2-e6-ai-credible-coercion-20261122
permissions:
  contents: write
jobs:
  format-owned:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/c5-class2-e6-ai-credible-coercion-20261122
          persist-credentials: true
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - name: Format only E6's owned files using pinned oxfmt
        run: |
          npx --no-install oxfmt --write \
            packages/engine/src/national/ai/NationalCoercionStrategy.ts \
            packages/engine/src/national/ai/NationalPoliticalStrategy.ts \
            packages/engine/src/execution/NationExecution.ts \
            tests/national/C5Class2E6Coercion.test.ts
      - name: Commit audited formatting-only diff (never merge)
        run: |
          set -euo pipefail
          git diff --stat
          if git diff --quiet; then
            echo 'No formatting changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/engine/src/national/ai/NationalCoercionStrategy.ts \
            packages/engine/src/national/ai/NationalPoliticalStrategy.ts \
            packages/engine/src/execution/NationExecution.ts \
            tests/national/C5Class2E6Coercion.test.ts
          git commit -m 'style(national-ai): apply pinned oxfmt to E6 changes'
          git push origin HEAD:refs/heads/feature/c5-class2-e6-ai-credible-coercion-20261122
