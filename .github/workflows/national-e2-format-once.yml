name: NATIONAL E2 one-time pinned formatting

on:
  push:
    branches: [stage3/e2-round5-war-levy-completion-20261116]
    paths:
      - .github/workflows/national-e2-format-once.yml

permissions:
  contents: write

jobs:
  format-owned-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact E2 branch
        uses: actions/checkout@v4
        with:
          ref: stage3/e2-round5-war-levy-completion-20261116
          persist-credentials: true
          submodules: false
      - name: Pin Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Pin required npm version
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Install lockfile-pinned dependencies
        run: npm run inst
      - name: Run exact locked oxfmt on five E2 tests
        shell: bash
        run: |
          set -euo pipefail
          files=(
            tests/national/ConflictLiveGame.test.ts
            tests/national/LiveLevyCombatRound5.test.ts
            tests/national/LiveWarExecutionRound5.test.ts
            tests/national/NationalFoundEmpireRequestId.test.ts
            tests/national/NationalPublicWireContract.test.ts
          )
          ./node_modules/.bin/oxfmt --write "${files[@]}"
          ./node_modules/.bin/oxfmt --check "${files[@]}"
          git diff --check
          echo "=== Pinned E2 formatting summary ==="
          git diff --stat -- "${files[@]}"
      - name: Commit only five formatted E2 files and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          files=(
            tests/national/ConflictLiveGame.test.ts
            tests/national/LiveLevyCombatRound5.test.ts
            tests/national/LiveWarExecutionRound5.test.ts
            tests/national/NationalFoundEmpireRequestId.test.ts
            tests/national/NationalPublicWireContract.test.ts
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          rm -f .github/workflows/national-e2-format-once.yml
          git add -u -- .github/workflows/national-e2-format-once.yml
          echo "=== Exact staged paths ==="
          git diff --cached --name-only
          git commit -m "style(national): apply pinned oxfmt to five E2 tests" || exit 1
          git push origin HEAD:refs/heads/stage3/e2-round5-war-levy-completion-20261116
          echo "E2_NEW_HEAD=$(git rev-parse HEAD)"
