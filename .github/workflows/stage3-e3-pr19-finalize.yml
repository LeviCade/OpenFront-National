name: Stage 3 E3 PR19 Final Format and Diagnostics Removal
on:
  push:
    branches:
      - stage3/integration-20261115
    paths:
      - .github/workflows/stage3-e3-pr19-finalize.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout E3 head
        uses: actions/checkout@v4
        with:
          ref: stage3/e3-round3-live-observation-20261115
          fetch-depth: 0
          persist-credentials: true
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Set pinned npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Locked dependencies
        run: npm run inst
      - name: Remove temporary probe and format only E3-owned files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "8f1b6c7cc8231f60836c4171e10637b13435168a"
          git rm tests/national/E3PatchFormatCapture.test.ts
          npm exec -- oxfmt --write \
            packages/engine/src/GameRunner.ts \
            packages/engine/src/execution/NationExecution.ts \
            packages/engine/src/national/README.md \
            packages/engine/src/national/ai/NationalPlanner.ts \
            packages/engine/src/national/observation/LiveObservation.ts \
            packages/engine/src/national/observation/NationalObservation.ts \
            packages/engine/src/national/observation/NationalOutbound.ts \
            packages/engine/src/worker/Worker.worker.ts \
            tests/national/NationalLiveObservation.test.ts
          git diff --stat
          npm run format:check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/engine/src/GameRunner.ts \
            packages/engine/src/execution/NationExecution.ts \
            packages/engine/src/national/README.md \
            packages/engine/src/national/ai/NationalPlanner.ts \
            packages/engine/src/national/observation/LiveObservation.ts \
            packages/engine/src/national/observation/NationalObservation.ts \
            packages/engine/src/national/observation/NationalOutbound.ts \
            packages/engine/src/worker/Worker.worker.ts \
            tests/national/NationalLiveObservation.test.ts
          git commit -m "style(E3): drop diagnostic probe and format real observation implementation"
          git push origin HEAD:refs/heads/stage3/e3-round3-live-observation-20261115
