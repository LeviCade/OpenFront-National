name: C5 Class Three E4 — Paid National Assessment Exact SHA
on:
  push:
    branches:
      - feature/c5-class3-e4-paid-national-assessment-20261122
  pull_request:
    branches:
      - stage3/conductor5-class3-integration-20261122
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c5-c3-e4-assessment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Paid assessment exact-source ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        gate: [typecheck, gameplay, format, lint, production-build, full-suite]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - name: Run exact-source gate
        shell: bash
        env:
          GATE: ${{ matrix.gate }}
        run: |
          set -euo pipefail
          case "$GATE" in
            typecheck) npm run typecheck ;;
            gameplay)
              npx --no-install vitest run --project node \
                tests/national/C5Class3PaidNationalAssessment.test.ts \
                tests/national/C5Class3AssessmentWire.test.ts \
                tests/national/C5Class2FundedRecon.test.ts \
                tests/national/NationalLiveObservation.test.ts \
                tests/national/NationalObservation.test.ts
              ;;
            format)
              npx --no-install oxfmt --check \
                packages/engine-api/src/Schemas.ts \
                packages/engine-api/src/game/GameUpdates.ts \
                packages/engine-api/src/game/NationalAssessmentView.ts \
                packages/engine/src/national/observation/NationalAssessment.ts \
                packages/engine/src/execution/NationalAssessmentExecution.ts \
                packages/engine/src/game/Game.ts \
                packages/engine/src/game/GameImpl.ts \
                packages/engine/src/execution/ExecutionManager.ts \
                packages/engine/src/snapshot/ExecutionRegistry.ts \
                packages/engine/src/national/observation/NationalObservation.ts \
                packages/engine/src/national/observation/LiveObservation.ts \
                packages/engine/src/national/observation/NationalOutbound.ts \
                src/client/replay/codec/FrameNormalizer.ts \
                src/server/national/NationalRecipientWire.ts \
                src/client/TrustedNationalSession.ts \
                tests/national/C5Class3PaidNationalAssessment.test.ts \
                tests/national/C5Class3AssessmentWire.test.ts \
                tests/core/snapshot/FullGameSnapshot.test.ts
              ;;
            lint) npm run lint ;;
            production-build) npm run build-prod ;;
            full-suite) npm test ;;
            *) exit 1 ;;
          esac
      - name: Print formatter patch for author reconciliation
        if: failure() && matrix.gate == 'format'
        shell: bash
        run: |
          npx --no-install oxfmt --write \
            packages/engine-api/src/Schemas.ts \
            packages/engine-api/src/game/GameUpdates.ts \
            packages/engine-api/src/game/NationalAssessmentView.ts \
            packages/engine/src/national/observation/NationalAssessment.ts \
            packages/engine/src/execution/NationalAssessmentExecution.ts \
            packages/engine/src/game/Game.ts \
            packages/engine/src/game/GameImpl.ts \
            packages/engine/src/execution/ExecutionManager.ts \
            packages/engine/src/snapshot/ExecutionRegistry.ts \
            packages/engine/src/national/observation/NationalObservation.ts \
            packages/engine/src/national/observation/LiveObservation.ts \
            packages/engine/src/national/observation/NationalOutbound.ts \
            src/client/replay/codec/FrameNormalizer.ts \
            src/server/national/NationalRecipientWire.ts \
            src/client/TrustedNationalSession.ts \
            tests/national/C5Class3PaidNationalAssessment.test.ts \
            tests/national/C5Class3AssessmentWire.test.ts \
            tests/core/snapshot/FullGameSnapshot.test.ts
          git diff --stat
          git --no-pager diff -- packages/engine-api/src/Schemas.ts packages/engine-api/src/game/GameUpdates.ts packages/engine-api/src/game/NationalAssessmentView.ts packages/engine/src/national/observation/NationalAssessment.ts packages/engine/src/execution/NationalAssessmentExecution.ts packages/engine/src/game/Game.ts packages/engine/src/game/GameImpl.ts packages/engine/src/execution/ExecutionManager.ts packages/engine/src/snapshot/ExecutionRegistry.ts packages/engine/src/national/observation/NationalObservation.ts packages/engine/src/national/observation/LiveObservation.ts packages/engine/src/national/observation/NationalOutbound.ts src/client/replay/codec/FrameNormalizer.ts src/server/national/NationalRecipientWire.ts src/client/TrustedNationalSession.ts tests/national/C5Class3PaidNationalAssessment.test.ts tests/national/C5Class3AssessmentWire.test.ts tests/core/snapshot/FullGameSnapshot.test.ts
