name: C4 E4 - Native NATIONAL playability source validation (not browser certification)

on:
  push:
    branches:
      - feature/c4-class1-e4-native-playable-client-20261121
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c4-e4-source-${{ github.sha }}
  cancel-in-progress: false

jobs:
  e4-source:
    name: Exact-source trusted-map, private target and legacy regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact immutable HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
      - name: Assert exact source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "C4_E4_EXACT_SOURCE_SHA=$EXPECTED_SHA"
      - name: Pin Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.15.0"
          cache: npm
      - name: Install pinned npm and dependencies
        run: |
          npm install --global --ignore-scripts npm@12.1.0
          npm ci --ignore-scripts
      - name: Verify exact committed source formatting (emit suggested patch on failure)
        run: |
          npx --no-install oxfmt --check             src/client/controllers/NationalMapTargetController.ts             src/client/ClientGameRunner.ts             src/client/TrustedNationalSession.ts             src/client/view/GameView.ts             tests/ui/national/NationalHumanMapInputR11.test.ts             tests/ui/national/TrustedNationalProjectionMapC2.test.ts             src/client/Transport.ts src/client/hud/layers/MainRadialMenu.ts src/client/hud/layers/RadialMenuElements.ts src/client/WebGLFrameBuilder.ts src/client/render/NationalObserverMarkerLayer.ts tests/ui/national/C4NativeObserverRevocation.test.ts tests/util/viewStubs.ts src/client/view/PlayerView.ts tests/ui/national/NationalPrivatePanelClass5.test.ts || (npx --no-install oxfmt --write src/client/ClientGameRunner.ts src/client/TrustedNationalSession.ts src/client/view/GameView.ts src/client/Transport.ts src/client/hud/layers/MainRadialMenu.ts src/client/hud/layers/RadialMenuElements.ts src/client/WebGLFrameBuilder.ts src/client/render/NationalObserverMarkerLayer.ts tests/ui/national/TrustedNationalProjectionMapC2.test.ts tests/ui/national/C4NativeObserverRevocation.test.ts tests/util/viewStubs.ts src/client/view/PlayerView.ts tests/ui/national/NationalPrivatePanelClass5.test.ts; git diff --; git restore --worktree .; exit 1)
      - name: Targeted E4 real-code regressions
        if: always()
        run: |
          npx --no-install vitest run tests/ui/national/C4NativeObserverRevocation.test.ts             tests/ui/national/NationalHumanMapInputR11.test.ts             tests/ui/national/TrustedNationalProjectionMapC2.test.ts             tests/ui/national/NationalPrivateCapabilityClass5.test.ts             tests/ui/national/NationalPrivatePanelClass5.test.ts             tests/ui/national/NationalFoundingWire.test.ts             tests/ui/national/NationalWarWire.test.ts
      - name: Full project typecheck
        if: always()
        run: npm run typecheck
      - name: Changed source lint
        if: always()
        run: |
          npx --no-install oxlint             src/client/controllers/NationalMapTargetController.ts             src/client/ClientGameRunner.ts             src/client/TrustedNationalSession.ts             src/client/view/GameView.ts             tests/ui/national/NationalHumanMapInputR11.test.ts             tests/ui/national/TrustedNationalProjectionMapC2.test.ts             src/client/Transport.ts src/client/hud/layers/MainRadialMenu.ts src/client/hud/layers/RadialMenuElements.ts src/client/WebGLFrameBuilder.ts src/client/render/NationalObserverMarkerLayer.ts tests/ui/national/C4NativeObserverRevocation.test.ts tests/util/viewStubs.ts src/client/view/PlayerView.ts tests/ui/national/NationalPrivatePanelClass5.test.ts
      - name: Production build
        if: always()
        run: npm run build-prod

