name: Stage 3 E1 R4 Canonical-War Final Formatter
on:
  push:
    branches:
      - stage3/integration-20261115
    paths:
      - .github/workflows/stage3-e1-r4-finalize.yml
permissions:
  contents: write
jobs:
  finalize:
    if: github.repository == 'LeviCade/OpenFront-National'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3/e1-round4-political-state-bridge-20261116
          fetch-depth: 0
          persist-credentials: true
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - name: Remove temporary probe and run pinned formatter
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b936d8fa52e8e2c08c43c561cc9e2c2f94e41773"
          git rm tests/national/TemporaryFormatProbe.test.ts
          npm exec -- oxfmt --write \
            packages/engine/src/game/Game.ts \
            packages/engine/src/game/GameImpl.ts \
            packages/engine/src/national/NationalRuntime.ts \
            packages/engine/src/national/politics/NationalWarState.ts \
            packages/engine/src/national/politics/ROUND4_WAR_STATE.md \
            tests/national/LiveWarPoliticalState.test.ts
          npm run format:check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/engine/src/game/Game.ts \
            packages/engine/src/game/GameImpl.ts \
            packages/engine/src/national/NationalRuntime.ts \
            packages/engine/src/national/politics/NationalWarState.ts \
            packages/engine/src/national/politics/ROUND4_WAR_STATE.md \
            tests/national/LiveWarPoliticalState.test.ts
          git commit -m "style(E1 R4): remove temporary probe and format canonical WAR state"
          git push origin HEAD:refs/heads/stage3/e1-round4-political-state-bridge-20261116
