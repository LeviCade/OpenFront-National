name: NATIONAL — Real GPU browser gameplay acceptance

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact 40-character staging commit SHA (do not use moving branch names)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: national-hardware-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  gpu-browser:
    name: "Real GPU ${{ matrix.viewport }} ${{ matrix.scenario }}"
    runs-on: [self-hosted, gpu]
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
        scenario: [national, legacy]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject unreviewed or unstaged source commit
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid SHA"; exit 1; }
          git cat-file -e "$CANDIDATE_SHA^{commit}"
          allowed=0
          git fetch origin stage3/integration-20261115
          if git merge-base --is-ancestor "$CANDIDATE_SHA" FETCH_HEAD; then
            allowed=1
          fi
          git fetch origin stage3/round6-combined-acceptance-20261116
          if git merge-base --is-ancestor "$CANDIDATE_SHA" FETCH_HEAD; then
            allowed=1
          fi
          if [ "$allowed" -ne 1 ]; then
            echo "Refusing commit outside approved integration/staging history"
            exit 1
          fi
          git checkout --detach "$CANDIDATE_SHA"
          mkdir -p national-qa-artifacts/gpu
          printf '%s\n' "$CANDIDATE_SHA" > national-qa-artifacts/gpu/sha.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: npm install --global --ignore-scripts npm@12.1.0
      - name: Install pinned dependencies
        run: npm run inst
      - name: Capture actual GPU driver capabilities
        shell: bash
        run: |
          (nvidia-smi -q || true) > national-qa-artifacts/gpu/nvidia-smi.txt
          (glxinfo -B || true) > national-qa-artifacts/gpu/glxinfo.txt
          (system_profiler SPDisplaysDataType || true) > national-qa-artifacts/gpu/macos-displays.txt
          if command -v google-chrome >/dev/null 2>&1; then
            BROWSER="$(command -v google-chrome)"
          elif [ -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" ]; then
            BROWSER="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          elif command -v chromium >/dev/null 2>&1; then
            BROWSER="$(command -v chromium)"
          else
            echo "GPU runner must have Google Chrome or Chromium" >&2
            exit 1
          fi
          printf 'CHROME_BIN=%s\n' "$BROWSER" >> "$GITHUB_ENV"
      - name: Run real browser through WebGL game gate
        shell: bash
        env:
          NATIONAL_REQUIRE_HARDWARE_GPU: "1"
        run: |
          set -euo pipefail
          node scripts/national-qa/browser-gameplay.mjs ${{ matrix.viewport == 'mobile' && '--mobile' || '' }} ${{ matrix.scenario == 'legacy' && '--legacy' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: national-hardware-${{ matrix.viewport }}-${{ matrix.scenario }}-${{ inputs.candidate_sha }}
          path: national-qa-artifacts/
          if-no-files-found: warn
          retention-days: 30
