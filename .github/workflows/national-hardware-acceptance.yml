name: NATIONAL — strictly signed Skybot GPU gameplay acceptance

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact 40-character SHA reachable from approved staging and descended from integration base"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: national-hardware-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  gpu-browser:
    name: Four real game scenarios on one trusted GPU guest
    if: github.event_name == 'workflow_dispatch' && github.repository == 'LeviCade/OpenFront-National' && github.ref == 'refs/heads/main'
    runs-on: skybot-ci-gpu
    timeout-minutes: 55
    env:
      NATIONAL_REQUIRE_HARDWARE_GPU: "1"
      NATIONAL_CHROME_ANGLE_BACKEND: gl-egl
      NATIONAL_GPU_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      NATIONAL_GPU_RUNNER_SCALE_SET: skybot-ci-gpu
      EGL_PLATFORM: surfaceless
      CHROME_BIN: /opt/skybot-gpu-runtime/chrome-headless-shell-linux64/chrome-headless-shell
    steps:
      - name: Confirm authorized default-branch dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = LeviCade/OpenFront-National
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          [[ "$NATIONAL_GPU_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'REFUSED: candidate must be an immutable lowercase 40-character SHA' >&2
            exit 1
          }
          test "$RUNNER_ENVIRONMENT" = self-hosted || {
            echo 'REFUSED: trusted Skybot execution requires self-hosted runner' >&2
            exit 1
          }
          test "$(id -u)" -ne 0 || {
            echo 'REFUSED: disposable guest workflow must not run as root' >&2
            exit 1
          }

      - name: Checkout review base without retaining token
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify candidate belongs to approved staging ancestry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p national-qa-artifacts/gpu
          BASE_SHA=2cfe3d4f91f28df61c7ebd7c429c9fdca674daf0
          staging=refs/remotes/origin/stage3/conductor2-class1-engineering-20261121
          git fetch --no-tags origin \
            '+refs/heads/stage3/conductor2-class1-engineering-20261121:'"$staging"
          git cat-file -e "$NATIONAL_GPU_CANDIDATE_SHA^{commit}"
          git merge-base --is-ancestor "$BASE_SHA" "$NATIONAL_GPU_CANDIDATE_SHA" || {
            echo 'REFUSED: candidate diverges from accepted Second Conductor first-class base' >&2
            exit 1
          }
          # No stale or earlier source: one exact reviewed Conductor staging tip.
          test "$(git rev-parse "$staging")" = "$NATIONAL_GPU_CANDIDATE_SHA" || {
            echo 'REFUSED: candidate is not the exact Second Conductor first-class staging HEAD' >&2
            exit 1
          }
          printf '%s\n' "$staging" > national-qa-artifacts/gpu/approved-staging-ref.txt
          git checkout --detach "$NATIONAL_GPU_CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$NATIONAL_GPU_CANDIDATE_SHA"
          printf '%s\n' "$NATIONAL_GPU_CANDIDATE_SHA" > national-qa-artifacts/gpu/sha.txt
          test -f scripts/national-gpu-ci/run-four-modes.sh || {
            echo 'BLOCKED: candidate missing E6 four-mode runner' >&2
            exit 1
          }
          test -f scripts/national-gpu-ci/sanitize-browser-evidence.mjs || {
            echo 'BLOCKED: candidate lacks reviewed E6 evidence sanitizer' >&2
            exit 1
          }
          test -f scripts/national-qa/trusted-gpu-keys.json || {
            echo 'BLOCKED: candidate lacks E5 trust-root enrollment source' >&2
            exit 1
          }
          grep -Fq 'gl-egl' scripts/national-qa/browser-gameplay.mjs || {
            echo 'BLOCKED: E5 reviewed gl-egl browser harness absent' >&2
            exit 1
          }
          printf 'SOURCE_ADMISSION=PASS\n' | tee national-qa-artifacts/gpu/source-admission.txt

      - name: Inspect guest GPU and trusted hardware-proof availability
        shell: bash
        run: |
          set -euo pipefail
          test -x "$CHROME_BIN" || {
            echo "BLOCKED: pinned Chrome Headless Shell not installed: $CHROME_BIN" >&2
            exit 1
          }
          mkdir -p national-qa-artifacts/gpu
          {
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            echo "RUNNER_NAME=$RUNNER_NAME"
            echo "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT"
            echo "SOURCE_SHA=$NATIONAL_GPU_CANDIDATE_SHA"
            echo "BROWSER=$CHROME_BIN"
            id
            uname -a
            ls -l /dev/dri || true
            for n in /sys/class/drm/renderD*/device/driver; do
              if test -L "$n"; then readlink "$n"; fi
            done
            for n in /sys/class/drm/renderD*/device/vendor; do
              if test -r "$n"; then cat "$n"; fi
            done
          } > national-qa-artifacts/gpu/guest-inventory.txt
          (glxinfo -B || true) > national-qa-artifacts/gpu/glxinfo.txt 2>&1
          # A guest-produced JSON object is NOT independent host evidence.
          # The trusted host must deliver four fresh signed PUBLIC proofs
          # AFTER the single dependency install, one for EACH browser process.
          # Per-mode wait-host-proof.mjs checks Ed25519 enrollment, exact
          # SHA/run/attempt/runner/nonce/mode and 120-second expiry before E5.
          # NATIONAL_GPU_ATTESTATION_FILE, NATIONAL_GPU_PUBLIC_KEY_FILE,
          # NATIONAL_GPU_ATTESTATION_CHALLENGE are set per-mode by E6 runner.
          echo 'HOST_PROOF_GATE=DEFERRED_TO_PER_MODE_SIGNED_VERIFIER'

      - name: Set up pinned Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Pin npm and install all dependencies once
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts npm@12.1.0
          test "$(node --version)" = v24.15.0
          test "$(npm --version)" = 12.1.0
          npm run inst

      - name: Run four independent E5 scenarios / release-signed lane
        id: scenarios
        shell: bash
        run: bash scripts/national-gpu-ci/run-four-modes.sh release

      - name: Upload bounded GPU evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: national-skybot-gpu-${{ inputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: national-qa-artifacts/gpu/public/release/
          if-no-files-found: warn
          retention-days: 14
