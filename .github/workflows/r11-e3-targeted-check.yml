name: R11 E3 focused private packet and bot feedback probe (temporary)
on:
  push:
    branches:
      - feature/r11-e3-private-packets-ai-20261121
    paths:
      - .github/workflows/r11-e3-targeted-check.yml
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Exact repository npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Pinned install
        run: npm run inst
      - name: Typecheck
        run: npm run typecheck
      - name: Focused E3 NATIONAL suites
        run: npx --no-install vitest run --project node tests/national/NationalAccessionPacketsR11.test.ts tests/national/NationalBotRejectionRoundtripR11.test.ts tests/national/NationalPoliticalPackets.test.ts tests/national/NationalCampaignRoundtripR10.test.ts tests/national/NationalHumanMemoryPackets.test.ts
      - name: Pinned formatter and exact formatted content
        if: always()
        shell: bash
        run: |
          npx --no-install oxfmt --write packages/engine/src/national/observation/NationalOutbound.ts tests/national/NationalAccessionPacketsR11.test.ts tests/national/NationalBotRejectionRoundtripR11.test.ts
          for f in packages/engine/src/national/observation/NationalOutbound.ts tests/national/NationalAccessionPacketsR11.test.ts tests/national/NationalBotRejectionRoundtripR11.test.ts; do
            echo "__R11_E3_FORMAT_BEGIN__${f}"
            cat "${f}"
            echo "__R11_E3_FORMAT_END__${f}"
          done
