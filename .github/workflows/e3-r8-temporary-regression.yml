name: E3 R8 - One Shot Legacy+Real Defense Regression
on:
  push:
    branches:
      - feature/national-r8-e3-strategic-fog-ai-20261117
    paths:
      - .github/workflows/e3-r8-temporary-regression.yml
permissions:
  contents: write
jobs:
  verify-r8-legacy-and-new:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/national-r8-e3-strategic-fog-ai-20261117
          submodules: false
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - name: Pinned format of only E3 changed files
        shell: bash
        run: |
          set -euo pipefail
          npm exec -- oxfmt --write \
            packages/engine/src/national/ai/NationalPlanner.ts \
            packages/engine/src/execution/NationExecution.ts \
            tests/national/NationalStrategicSimulationR8.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/engine/src/national/ai/NationalPlanner.ts packages/engine/src/execution/NationExecution.ts tests/national/NationalStrategicSimulationR8.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(national): pinned R8 defense and legacy regression source"
            git push origin HEAD:refs/heads/feature/national-r8-e3-strategic-fog-ai-20261117
          fi
      - run: npm run typecheck
      - name: Run legacy and new real NATIONAL scenarios
        run: |
          npm exec -- vitest run --project node \
            tests/national/NationalPlanner.test.ts \
            tests/national/NationalIntelligencePerf.test.ts \
            tests/national/NationalWarSides.test.ts \
            tests/national/NationalStrategicSimulationR8.test.ts \
            tests/national/NationalGeographicFogR8.test.ts \
            tests/national/NationalAIRealWar.test.ts \
            tests/qa/national/PacketCanaries.test.ts
      - run: npm run lint
