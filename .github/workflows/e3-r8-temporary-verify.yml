name: E3 R8 - One Shot AI / Fog Validation
on:
  push:
    branches:
      - feature/national-r8-e3-strategic-fog-ai-20261117
    paths:
      - .github/workflows/e3-r8-temporary-verify.yml
permissions:
  contents: write
jobs:
  formatter-and-real-simulations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/national-r8-e3-strategic-fog-ai-20261117
          submodules: false
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - name: Apply pinned format to only E3 code and tests
        shell: bash
        run: |
          set -euo pipefail
          npm exec -- oxfmt --write \
            packages/engine/src/national/ai/NationalPlanner.ts \
            packages/engine/src/execution/NationExecution.ts \
            packages/engine/src/national/observation/LiveObservation.ts \
            tests/national/NationalStrategicSimulationR8.test.ts \
            tests/national/NationalGeographicFogR8.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/engine/src/national/ai/NationalPlanner.ts \
            packages/engine/src/execution/NationExecution.ts \
            packages/engine/src/national/observation/LiveObservation.ts \
            tests/national/NationalStrategicSimulationR8.test.ts \
            tests/national/NationalGeographicFogR8.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(national): pinned formatter for R8 E3-owned files"
            git push origin HEAD:refs/heads/feature/national-r8-e3-strategic-fog-ai-20261117
          fi
      - name: Typecheck actual NATIONAL source
        run: npm run typecheck
      - name: Exercise seeded real AI and fog scenarios
        run: |
          npm exec -- vitest run --project node \
            tests/national/NationalStrategicSimulationR8.test.ts \
            tests/national/NationalGeographicFogR8.test.ts \
            tests/national/NationalAIRealWar.test.ts \
            tests/national/NationalHumanMemoryPackets.test.ts \
            tests/qa/national/PacketCanaries.test.ts
      - name: Validate lint
        run: npm run lint
