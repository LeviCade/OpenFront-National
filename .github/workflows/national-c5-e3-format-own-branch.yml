name: NATIONAL C5 E3 — deterministic own-branch formatting

on:
  push:
    branches:
      - feature/c5-class1-e3-imperial-war-policy-20261122

permissions:
  contents: write

jobs:
  format-c5-files:
    if: "!contains(github.event.head_commit.message, '[formatted]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/c5-class1-e3-imperial-war-policy-20261122
          persist-credentials: true
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - name: Format only E3-owned source and scenario files
        run: |
          set -euo pipefail
          files=(
            packages/engine-api/src/Schemas.ts
            packages/engine/src/execution/NationalFoundEmpireExecution.ts
            packages/engine/src/execution/NationalWarExecution.ts
            packages/engine/src/game/GameImpl.ts
            packages/engine/src/national/NationalRuntime.ts
            packages/engine/src/national/conflict/WarLedger.ts
            packages/engine/src/national/politics/NationalWarState.ts
            packages/engine/src/national/politics/PoliticalAuthorityAdapter.ts
            packages/engine/src/national/politics/sovereignty.ts
            tests/national/C5ImperialWarPolicy.test.ts
            tests/national/imperial-accounting-exhaustive.mjs
          )
          npx --no-install oxfmt --write "${files[@]}"
          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            echo "C5 E3 formatting already exact"
            exit 0
          fi
          git -c color.ui=false diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(C5 E3): apply exact repository formatting [formatted]"
          git push origin HEAD:refs/heads/feature/c5-class1-e3-imperial-war-policy-20261122
