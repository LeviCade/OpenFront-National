name: C5 E1 exact map-picker final formatter
on:
  pull_request:
    branches:
      - stage3/conductor5-class3-integration-20261122
    paths:
      - ".github/workflows/c5-class3-e1-formatter-once.yml"
permissions:
  contents: write
jobs:
  format-own-map-head:
    if: >-
      github.event.pull_request.head.repo.full_name == 'LeviCade/OpenFront-National' &&
      github.event.pull_request.head.ref == 'feature/c5-class3-e1-native-coercion-recon-ui-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          submodules: false
          fetch-depth: 1
      - name: Pin exact submitted source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - name: Format only the two remaining new map files
        run: |
          npx --no-install oxfmt src/client/controllers/NationalMapTargetController.ts tests/ui/national/NationalReconMapPick.test.ts
      - name: Submit format-only fast-forward commit
        shell: bash
        run: |
          set -euo pipefail
          git add src/client/controllers/NationalMapTargetController.ts tests/ui/national/NationalReconMapPick.test.ts
          if git diff --cached --quiet; then
            echo "Map files already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(c5-e1): oxfmt real map selection and 390x844 test"
          git push origin HEAD:refs/heads/feature/c5-class3-e1-native-coercion-recon-ui-20261122
