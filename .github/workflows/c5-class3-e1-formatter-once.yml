name: C5 E1 one-shot exact branch formatter
on:
  pull_request:
    branches:
      - stage3/conductor5-class3-integration-20261122
    paths:
      - ".github/workflows/c5-class3-e1-formatter-once.yml"
permissions:
  contents: write
jobs:
  format-own-head:
    if: >-
      github.event.pull_request.head.repo.full_name == 'LeviCade/OpenFront-National' &&
      github.event.pull_request.head.ref == 'feature/c5-class3-e1-native-coercion-recon-ui-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          submodules: false
          fetch-depth: 1
      - name: Assert exact original branch head before edits
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.head_ref }}" = "feature/c5-class3-e1-native-coercion-recon-ui-20261122"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - name: Format ONLY E1-owned or E1-scoped files
        run: |
          npx --no-install oxfmt \
            src/client/NationalDiplomacyPanel.ts \
            src/client/NationalSovereignActions.ts \
            src/client/Transport.ts \
            src/client/view/GameView.ts \
            src/client/replay/codec/FrameNormalizer.ts \
            packages/engine-api/src/game/GameUpdates.ts \
            packages/engine-api/src/game/NationalReconView.ts \
            packages/engine/src/execution/NationalUltimatumExecution.ts \
            packages/engine/src/national/observation/NationalOutbound.ts \
            packages/engine/src/national/observation/NationalReconnaissance.ts \
            tests/ui/national/NationalSovereignActions.test.ts \
            tests/ui/national/NationalSovereignControls.test.ts
      - name: Create format-only fast-forward commit on assigned head
        shell: bash
        run: |
          set -euo pipefail
          git add \
            src/client/NationalDiplomacyPanel.ts \
            src/client/NationalSovereignActions.ts \
            src/client/Transport.ts \
            src/client/view/GameView.ts \
            src/client/replay/codec/FrameNormalizer.ts \
            packages/engine-api/src/game/GameUpdates.ts \
            packages/engine-api/src/game/NationalReconView.ts \
            packages/engine/src/execution/NationalUltimatumExecution.ts \
            packages/engine/src/national/observation/NationalOutbound.ts \
            packages/engine/src/national/observation/NationalReconnaissance.ts \
            tests/ui/national/NationalSovereignActions.test.ts \
            tests/ui/national/NationalSovereignControls.test.ts
          if git diff --cached --quiet; then echo "Nothing to format"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(c5-e1): apply repository oxfmt to E1 feature changes"
          git push origin HEAD:refs/heads/feature/c5-class3-e1-native-coercion-recon-ui-20261122
