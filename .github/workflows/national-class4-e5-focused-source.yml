name: NATIONAL Class Four E5 - focused source verification

on:
  push:
    branches:
      - feature/class4-e5-real-3player-browser-20261121
    paths:
      - scripts/national-qa/browser-gameplay.mjs
      - scripts/national-qa/browser-r11-verdict.mjs
      - scripts/national-qa/browser-r11-political-verdict.mjs
      - tests/qa/national/RoundElevenBrowserActions.test.mjs
      - .github/workflows/national-class4-e5-focused-source.yml

permissions:
  contents: read

concurrency:
  group: class4-e5-focused-source
  cancel-in-progress: true

jobs:
  focused:
    name: E5 pinned source-only verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Pin Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Pin npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Install pinned dependencies
        run: npm run inst
      - name: Check exact E5-owned source formatting
        shell: bash
        run: |
          set -euo pipefail
          files=(
            scripts/national-qa/browser-gameplay.mjs
            scripts/national-qa/browser-r11-verdict.mjs
            scripts/national-qa/browser-r11-political-verdict.mjs
            tests/qa/national/RoundElevenBrowserActions.test.mjs
          )
          if ! npx --no-install oxfmt --check "${files[@]}"; then
            npx --no-install oxfmt --write "${files[@]}"
            git diff -- "${files[@]}"
            exit 1
          fi
      - name: Syntax check all E5-owned changed modules
        run: |
          node --check scripts/national-qa/browser-gameplay.mjs
          node --check scripts/national-qa/browser-r11-verdict.mjs
          node --check scripts/national-qa/browser-r11-political-verdict.mjs
          node --check tests/qa/national/RoundElevenBrowserActions.test.mjs
      - name: Run focused browser-action source tests
        run: npx --no-install vitest run --project node tests/qa/national/RoundElevenBrowserActions.test.mjs
      - name: Lint E5-owned files only
        run: npx --no-install oxlint scripts/national-qa/browser-gameplay.mjs scripts/national-qa/browser-r11-verdict.mjs scripts/national-qa/browser-r11-political-verdict.mjs tests/qa/national/RoundElevenBrowserActions.test.mjs
