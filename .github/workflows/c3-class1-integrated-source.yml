name: C3 First Class - Exact Integrated Source Acceptance

on:
  push:
    branches:
      - stage3/conductor3-class1-integration-20261121
  pull_request:
    branches:
      - stage3/conductor2-class1-engineering-20261121
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c3-source-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  integrated-source:
    name: Six-engineer combined source and independent security suite
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout exact immutable PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
      - name: Assert source identity
        shell: bash
        env:
          REQUIRED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "C3_EXACT_SOURCE_SHA=$actual"
          test "$actual" = "$REQUIRED_SHA"
      - name: Pin Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.15.0"
          cache: npm
      - name: Install pinned npm and dependencies
        run: |
          npm install --global --ignore-scripts npm@12.1.0
          npm run inst
      - name: Strict pinned formatting
        run: npm run format:check
      - name: Whole-project typecheck
        run: npm run typecheck
      - name: All project tests
        run: npm test
      - name: Independent E5 negative controls
        run: node --test tests/e2e/national/C2IndependentBrowserPlaythrough.test.mjs
      - name: E6 workflow safety contract
        run: |
          bash -n scripts/national-gpu-ci/run-four-modes.sh
          node --test scripts/national-gpu-ci/verify-workflow.mjs
      - name: Whole-project lint
        run: npm run lint
      - name: Production bundle
        run: npm run build-prod
