name: NATIONAL R9 — one-time trusted staging formatter

on:
  push:
    branches:
      - stage3/round9-combined-acceptance-20261121
    paths:
      - .github/workflows/r9-one-time-stage-format.yml

permissions:
  contents: write

concurrency:
  group: national-r9-stage-formatter
  cancel-in-progress: false

jobs:
  format-staged-source:
    if: github.repository == 'LeviCade/OpenFront-National' && github.actor == 'LeviCade'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Install pinned source formatter
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts npm@12.1.0
          npm run inst
      - name: Format only changed integration candidate files
        shell: bash
        run: |
          set -euo pipefail
          BASE=42e2b5d0a6372737b78178e5be49da7b76383d0a
          git cat-file -e "$BASE^{commit}"
          mapfile -d '' -t paths < <(git diff --name-only -z --diff-filter=ACMRT "$BASE"...HEAD)
          files=()
          for path in "${paths[@]}"; do
            if [[ "$path" != .github/workflows/r9-one-time-stage-format.yml ]]; then
              files+=("$path")
            fi
          done
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No application files selected"; exit 1
          fi
          npm exec -- oxfmt --write "${files[@]}"
          git add -- "${files[@]}"
          git rm -- .github/workflows/r9-one-time-stage-format.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(stage3): pinned one-time Round Nine combined formatter"
          git push origin HEAD:refs/heads/stage3/round9-combined-acceptance-20261121
