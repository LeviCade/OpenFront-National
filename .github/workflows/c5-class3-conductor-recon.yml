name: C5 Class Three — Conductor paid reconnaissance ingress
on:
  push:
    branches:
      - stage3/conductor5-class3-integration-20261122
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authenticated-recon-ingress:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Pin exact source
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - name: Typecheck all packages
        run: npm run typecheck
      - name: Client ingress and actual-game reconnaissance
        run: |
          npx --no-install vitest run tests/ui/national/NationalReconPurchase.test.ts
          npx --no-install vitest run --project node tests/national/C5Class2FundedRecon.test.ts
      - name: Exact touched-source formatting
        run: |
          npx --no-install oxfmt --check src/client/Transport.ts src/client/NationalReconPurchase.ts tests/ui/national/NationalReconPurchase.test.ts
      - name: Lint touched files
        run: npx --no-install oxlint src/client/Transport.ts src/client/NationalReconPurchase.ts tests/ui/national/NationalReconPurchase.test.ts
      - name: Production build
        run: npm run build-prod
