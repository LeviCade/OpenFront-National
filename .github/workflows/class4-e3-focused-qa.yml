name: Class Four E3 focused host-private packet acceptance
on:
  push:
    branches:
      - feature/class4-e3-server-private-packets-20261121
    paths:
      - .github/workflows/class4-e3-focused-qa.yml
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Pinned npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Install pinned dependencies
        run: npm run inst
      - name: Capture canonical formatted E3-owned blobs (test output only)
        run: |
          npx --no-install oxfmt --write packages/engine/src/national/observation/NationalServerOutbound.ts tests/national/NationalServerOutboundClass4.test.ts
          echo "E3FMT_SOURCE:$(base64 -w0 packages/engine/src/national/observation/NationalServerOutbound.ts)"
          echo "E3FMT_TEST:$(base64 -w0 tests/national/NationalServerOutboundClass4.test.ts)"
      - name: Exact TypeScript
        run: npm run typecheck
      - name: Four focused real-game NATIONAL suites
        run: npx --no-install vitest run --project node tests/national/NationalServerOutboundClass4.test.ts tests/national/NationalAccessionPacketsR11.test.ts tests/national/RoundElevenDelegatedPeaceWire.test.ts tests/national/NationalBotRejectionRoundtripR11.test.ts
