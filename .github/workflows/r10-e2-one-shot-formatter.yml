# E2 disposable evidence job: records pinned formatting for two source files.
# One-shot branch/path scoped. Remove this file in the next E2 commit.
name: R10 E2 pinned formatter one-shot
on:
  push:
    branches:
      - feature/r10-e2-live-combat-levy-20261121
    paths:
      - .github/workflows/r10-e2-one-shot-formatter.yml
permissions:
  contents: read
jobs:
  formatter-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Install pinned npm and workspace
        run: |
          npm install --global --ignore-scripts npm@12.1.0
          npm ci --ignore-scripts
      - name: Format only E2-owned R10 tests and emit exact UTF-8 values
        run: |
          npx --no-install oxfmt --write tests/national/RoundTenLiveCombatRunner.test.ts tests/national/RoundTenEmpireWire.test.ts
          git diff --check
          node <<'NODE'
          const fs = require('node:fs');
          const files = [
            'tests/national/RoundTenLiveCombatRunner.test.ts',
            'tests/national/RoundTenEmpireWire.test.ts'
          ];
          for (let i = 0; i < files.length; i++) {
            console.log('R10_E2_FORMATTED_' + i + '=' + JSON.stringify(fs.readFileSync(files[i], 'utf8')));
          }
          NODE
