name: C5 combined formatter witness (read-only artifact)
on:
  push:
    branches:
      - stage3/conductor5-class1-integration-20261122
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formatter-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Exact admitted source
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - name: Generate exact pinned-format correction without mutating remote
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install oxfmt --write docs/11-decisions.md docs/release/NATIONAL_C5_E3_IMPERIAL_WAR_POLICY.md packages/engine-api/src/game/NationalImperialView.ts packages/engine/src/execution/TradeShipExecution.ts packages/engine/src/game/TrainStation.ts packages/engine/src/national/NationalRuntime.ts packages/engine/src/national/ai/NationalPoliticalStrategy.ts tests/national/LiveSovereignty.test.ts
          mkdir -p /tmp/c5-formatter
          git diff --binary > /tmp/c5-formatter/pinned.patch
          git rev-parse HEAD > /tmp/c5-formatter/source-sha.txt
          wc -c /tmp/c5-formatter/pinned.patch
      - uses: actions/upload-artifact@v4
        with:
          name: c5-format-source-${{ github.sha }}
          path: /tmp/c5-formatter/
          if-no-files-found: error
          retention-days: 7
