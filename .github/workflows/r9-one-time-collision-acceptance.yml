name: NATIONAL R9 — final duplicate-request tick safety acceptance

on:
  push:
    branches:
      - stage3/round9-combined-acceptance-20261121
    paths:
      - .github/workflows/r9-one-time-collision-acceptance.yml

permissions:
  contents: write

concurrency:
  group: national-r9-collision-one-time
  cancel-in-progress: false

jobs:
  accept-collision-safety:
    if: github.repository == 'LeviCade/OpenFront-National' && github.actor == 'LeviCade'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Pin dependencies and format only the two changed E2 files
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts npm@12.1.0
          npm run inst
          npm exec -- oxfmt --write \
            packages/engine/src/execution/NationalWarExecution.ts \
            tests/national/RoundNineWarOutcomeRouting.test.ts
      - name: Typecheck and execute relevant real-game and negative regressions
        run: |
          set -euo pipefail
          npm run typecheck
          npm exec -- vitest run --project node \
            tests/national/RoundNineWarOutcomeRouting.test.ts \
            tests/national/RoundEightWarRequestId.test.ts \
            tests/national/LiveWarExecutionRound5.test.ts \
            tests/national/NationalWarPublicProjectionR9.test.ts \
            tests/ui/national/NationalWarWire.test.ts
      - name: Commit verified source and remove one-shot runner
        run: |
          set -euo pipefail
          git rm .github/workflows/r9-one-time-collision-acceptance.yml
          git add packages/engine/src/execution/NationalWarExecution.ts \
            tests/national/RoundNineWarOutcomeRouting.test.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(stage3): accept bounded E1 WAR collision denial and 5 suite integration"
          git push origin HEAD:refs/heads/stage3/round9-combined-acceptance-20261121
