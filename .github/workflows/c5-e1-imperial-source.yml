name: C5 E1 Imperial Source — exact head

on:
  push:
    branches:
      - feature/c5-class1-e1-centralized-armies-20261122
  pull_request:
    branches:
      - stage3/conductor5-class1-integration-20261122
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c5-e1-exact-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Imperial combat, WAR, sovereignty and replay
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
      - name: Assert exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "SOURCE_SHA=$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - run: npm run typecheck
      - name: Production-attack and sovereignty scenarios
        run: |
          npx --no-install vitest run --project node             tests/national/C5ImperialCentralCombat.test.ts             tests/national/LiveSovereignty.test.ts             tests/national/NationalWarSides.test.ts             tests/national/RoundEightWarInFlight.test.ts             tests/national/ConductorTwoCrownWarContinuity.test.ts
      - name: Format changed C5 engineering
        if: success() || failure()
        run: |
          npx --no-install oxfmt --check             packages/engine/src/national/NationalRuntime.ts             packages/engine/src/game/GameImpl.ts             packages/engine-api/src/Schemas.ts             tests/national/C5ImperialCentralCombat.test.ts             .github/workflows/c5-e1-imperial-source.yml

  full:
    name: Whole-tree regression, lint, formatting, build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - run: npm run typecheck
      - run: npm test
      - name: Lint
        if: success() || failure()
        run: npm run lint
      - name: Format
        if: success() || failure()
        run: npm run format:check
      - name: Build
        if: success() || failure()
        run: npm run build-prod
