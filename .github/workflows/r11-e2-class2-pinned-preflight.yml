name: R11 E2 One-Shot Pinned Format & Targeted Source Check
on:
  push:
    branches:
      - feature/r11-e2-foundation-combat-20261121
    paths:
      - .github/workflows/r11-e2-class2-pinned-preflight.yml
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Pin npm and install project dependencies once
        run: |
          npm install --global --ignore-scripts npm@12.1.0
          npm run inst
      - name: Format exact E2 changes with pinned oxfmt and expose bytes
        run: |
          npx --no-install oxfmt --write packages/engine-api/src/Schemas.ts packages/engine/src/execution/ExecutionManager.ts packages/engine/src/execution/NationalFoundEmpireExecution.ts tests/national/RoundElevenDelegatedPeaceWire.test.ts
          git diff --check
          node <<'NODE'
          const fs = require('node:fs');
          for (const [i, path] of [
            'packages/engine-api/src/Schemas.ts',
            'packages/engine/src/execution/ExecutionManager.ts',
            'packages/engine/src/execution/NationalFoundEmpireExecution.ts',
            'tests/national/RoundElevenDelegatedPeaceWire.test.ts',
          ].entries()) {
            console.log('R11_E2_CLASS2_FMT_' + i + '=' + JSON.stringify(fs.readFileSync(path,'utf8')));
          }
          NODE
      - name: Complete TypeScript project reference check
        run: npm run typecheck
      - name: Focused real GameRunner / snapshot / combat regressions
        run: |
          npx --no-install vitest run --project node \
            tests/national/RoundElevenDelegatedPeaceWire.test.ts \
            tests/national/RoundElevenFoundationCombat.test.ts \
            tests/national/RoundTenNationExecutionBridge.test.ts \
            tests/national/RoundTenLiveCombatRunner.test.ts
