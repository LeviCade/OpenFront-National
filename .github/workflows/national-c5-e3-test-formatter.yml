name: NATIONAL C5 E3 — format expanded WAR witness once

on:
  push:
    branches:
      - feature/c5-class1-e3-imperial-war-policy-20261122

permissions:
  contents: write

jobs:
  format-witness:
    if: "!contains(github.event.head_commit.message, '[formatted witness]')"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/c5-class1-e3-imperial-war-policy-20261122
          persist-credentials: true
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - name: Only format new WAR-08 scenario witnesses
        run: |
          set -euo pipefail
          f=tests/national/C5ImperialWarPolicy.test.ts
          npx --no-install oxfmt --write "$f"
          git add -- "$f"
          if git diff --cached --quiet; then exit 0; fi
          git -c color.ui=false diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(C5 E3): format additional wartime witnesses [formatted witness]"
          git push origin HEAD:refs/heads/feature/c5-class1-e3-imperial-war-policy-20261122
