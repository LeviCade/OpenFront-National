name: NATIONAL E2 R9 one-shot pinned formatter correction

on:
  push:
    branches:
      - stage3/e2-round8-war-levy-conservation-20261117
    paths:
      - .github/workflows/national-e2-r9-one-shot-format.yml

permissions:
  contents: write

jobs:
  format-one-file-and-self-remove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3/e2-round8-war-levy-conservation-20261117
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Use pinned npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Install exact lock
        run: npm run inst
      - name: Correct only one E2-owned test with pinned oxfmt
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/oxfmt --write tests/national/RoundNineWarOutcomeRouting.test.ts
          ./node_modules/.bin/oxfmt --check tests/national/RoundNineWarOutcomeRouting.test.ts
          git diff --check
          git diff -- tests/national/RoundNineWarOutcomeRouting.test.ts
      - name: Commit precise style fix and REMOVE this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/national-e2-r9-one-shot-format.yml
          git add -u -- .github/workflows/national-e2-r9-one-shot-format.yml
          git add -- tests/national/RoundNineWarOutcomeRouting.test.ts
          git commit -m "style(national): pin R9 E2 recipient-outcome test formatting"
          git push origin HEAD:refs/heads/stage3/e2-round8-war-levy-conservation-20261117
          echo "COMMITTED_EXACT_SHA=$(git rev-parse HEAD)"
