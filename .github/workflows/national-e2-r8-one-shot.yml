name: NATIONAL E2 R8 pinned style and spawned-game probe
on:
  push:
    branches: [stage3/e2-round8-war-levy-conservation-20261117]
    paths:
      - .github/workflows/national-e2-r8-one-shot.yml
permissions:
  contents: write
jobs:
  exact-r8:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3/e2-round8-war-levy-conservation-20261117
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Install repository pinned npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Install pinned dependencies
        run: npm run inst
      - name: Apply repository pinned formatter to exactly four E2 R8 files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            packages/engine/src/execution/NukeExecution.ts
            packages/engine/src/execution/TransportShipExecution.ts
            tests/national/RoundEightWarInFlight.test.ts
            tests/national/RoundEightLevyOverlap.test.ts
          )
          ./node_modules/.bin/oxfmt --write "${files[@]}"
          ./node_modules/.bin/oxfmt --check "${files[@]}"
          git diff --check
          git diff --stat -- "${files[@]}"
      - name: Commit formatted E2 files and self-remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- packages/engine/src/execution/NukeExecution.ts packages/engine/src/execution/TransportShipExecution.ts tests/national/RoundEightWarInFlight.test.ts tests/national/RoundEightLevyOverlap.test.ts
          rm -f .github/workflows/national-e2-r8-one-shot.yml
          git add -u -- .github/workflows/national-e2-r8-one-shot.yml
          git commit -m "style(national): pin R8 executable and spawned-game assertions"
          git push origin HEAD:refs/heads/stage3/e2-round8-war-levy-conservation-20261117
          echo "FORMATTED_HEAD=$(git rev-parse HEAD)"
      - name: Exact formatted source TypeScript
        run: npm run typecheck
      - name: E2 R8 spawned-game tests
        run: ./node_modules/.bin/vitest run --project node tests/national/RoundEightWarInFlight.test.ts tests/national/RoundEightLevyOverlap.test.ts
      - name: E2 R8 lint and pinned global format
        run: npm run lint && npm run format:check
