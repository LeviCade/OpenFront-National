name: NATIONAL E2 R8 pinned final source and targeted execution proof
on:
  push:
    branches: [stage3/e2-round8-war-levy-conservation-20261117]
    paths: [.github/workflows/national-e2-r8-proof-once.yml]
permissions:
  contents: write
jobs:
  e2-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3/e2-round8-war-levy-conservation-20261117
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Install required npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Install pinned packages
        run: npm run inst
      - name: Format exactly eight E2 R8 source and test files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            packages/engine-api/src/Schemas.ts
            packages/engine/src/execution/ExecutionManager.ts
            packages/engine/src/execution/NationalWarExecution.ts
            packages/engine/src/execution/NukeExecution.ts
            packages/engine/src/execution/TransportShipExecution.ts
            tests/national/RoundEightWarInFlight.test.ts
            tests/national/RoundEightLevyOverlap.test.ts
            tests/national/RoundEightWarRequestId.test.ts
          )
          ./node_modules/.bin/oxfmt --write "${files[@]}"
          ./node_modules/.bin/oxfmt --check "${files[@]}"
          git diff --check
          git diff --stat -- "${files[@]}"
      - name: Publish only E2 formatter edits and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- packages/engine-api/src/Schemas.ts packages/engine/src/execution/ExecutionManager.ts packages/engine/src/execution/NationalWarExecution.ts packages/engine/src/execution/NukeExecution.ts packages/engine/src/execution/TransportShipExecution.ts tests/national/RoundEightWarInFlight.test.ts tests/national/RoundEightLevyOverlap.test.ts tests/national/RoundEightWarRequestId.test.ts
          rm .github/workflows/national-e2-r8-proof-once.yml
          git add -u -- .github/workflows/national-e2-r8-proof-once.yml
          git commit -m "style(national): pinned Round Eight source and test formatting"
          git push origin HEAD:refs/heads/stage3/e2-round8-war-levy-conservation-20261117
          echo "PROOF_HEAD=$(git rev-parse HEAD)"
      - name: Full repository TypeScript
        run: npm run typecheck
      - name: Real spawned WAR and MDA plus request-correlation tests
        run: ./node_modules/.bin/vitest run --project node tests/national/RoundEightWarInFlight.test.ts tests/national/RoundEightLevyOverlap.test.ts tests/national/RoundEightWarRequestId.test.ts
      - name: Full repository lint and pinned formatting
        run: npm run lint && npm run format:check
