name: E3 R7 - Real Authenticated Worker Proof
on:
  push:
    branches:
      - stage3/e3-round7-worker-proof-20261116
    paths:
      - .github/workflows/e3-round7-worker-proof.yml
      - tests/national/NationalWorkerContractR7.test.ts
permissions:
  contents: write
jobs:
  live-engine-worker-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3/e3-round7-worker-proof-20261116
          submodules: false
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Install pinned npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Install pinned dependencies
        run: npm run inst
      - name: Format only E3 test
        shell: bash
        run: |
          set -euo pipefail
          npm exec -- oxfmt --write tests/national/NationalWorkerContractR7.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/national/NationalWorkerContractR7.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(national): R7 pinned formatter for real worker proof"
            git push origin HEAD:refs/heads/stage3/e3-round7-worker-proof-20261116
          fi
      - name: Typecheck actual combined candidate plus R7 proof
        run: npm run typecheck
      - name: Run authentic engine receipt and adversarial privacy tests
        run: |
          npm exec -- vitest run --project node \
            tests/national/NationalWorkerContractR7.test.ts \
            tests/national/NationalReceiptCorrelation.test.ts \
            tests/national/NationalPoliticalPackets.test.ts \
            tests/national/NationalHumanMemoryPackets.test.ts \
            tests/national/NationalAIRealWar.test.ts
      - name: Lint actual combined candidate
        run: npm run lint
