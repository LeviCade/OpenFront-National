name: E3 R7 One-Shot Pinned Source Formatter
on:
  push:
    branches:
      - stage3/e3-round5-political-packets-fog-20261116
    paths:
      - .github/workflows/e3-r7-one-shot-source-formatter.yml
permissions:
  contents: write
jobs:
  format-owned-r7-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3/e3-round5-political-packets-fog-20261116
          submodules: false
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Install pinned npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Install pinned dependencies
        run: npm run inst
      - name: Format only E3 R7 test
        shell: bash
        run: |
          set -euo pipefail
          npm exec -- oxfmt --write tests/national/NationalWorkerContractR7.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/national/NationalWorkerContractR7.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(national): pinned R7 optional-sequence test format"
            git push origin HEAD:refs/heads/stage3/e3-round5-political-packets-fog-20261116
          fi
      - name: Run E3 R7 and previous worker tests
        run: |
          npm exec -- vitest run --project node \
            tests/national/NationalWorkerContractR7.test.ts \
            tests/national/NationalReceiptCorrelation.test.ts
