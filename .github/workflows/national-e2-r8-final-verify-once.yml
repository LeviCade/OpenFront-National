name: NATIONAL E2 R8 final source and real-game proof
on:
  push:
    branches: [stage3/e2-round8-war-levy-conservation-20261117]
    paths: [.github/workflows/national-e2-r8-final-verify-once.yml]
permissions:
  contents: write
jobs:
  final-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3/e2-round8-war-levy-conservation-20261117
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Required npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Locked install
        run: npm run inst
      - name: Remove temporary CI workflow without touching gameplay source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/national-e2-r8-final-verify-once.yml
          git add -u -- .github/workflows/national-e2-r8-final-verify-once.yml
          git commit -m "ci(national): complete R8 proof runner cleanup"
          git push origin HEAD:refs/heads/stage3/e2-round8-war-levy-conservation-20261117
          echo "VERIFIED_SOURCE=$(git rev-parse HEAD)"
      - name: Full repository TypeScript
        run: npm run typecheck
      - name: Real WAR/MDA/correlation spawned-game tests
        run: ./node_modules/.bin/vitest run --project node tests/national/RoundEightWarInFlight.test.ts tests/national/RoundEightLevyOverlap.test.ts tests/national/RoundEightWarRequestId.test.ts
      - name: Full repository tests
        run: npm test
      - name: Full repository lint
        run: npm run lint
      - name: Full pinned formatting
        run: npm run format:check
      - name: Production build
        run: npm run build-prod
