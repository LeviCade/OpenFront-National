name: Class Five E4 one-time pinned Private NATIONAL validation
on:
  push:
    branches:
      - feature/class5-e4-private-national-ui-20261121
permissions:
  contents: write
jobs:
  private-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci --ignore-scripts
      - name: Pinned formatter over every complete touched source and document
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install oxfmt --write src/client/Transport.ts src/client/NationalDiplomacyPanel.ts src/client/NationalDiplomacyState.ts src/client/hud/layers/GameRightSidebar.ts src/client/NationalPrivateCapability.ts tests/ui/national/NationalPrivateCapabilityClass5.test.ts tests/ui/national/NationalPrivatePanelClass5.test.ts docs/release/NATIONAL_CLASS5_E4_PRIVATE_HUMAN_JOURNEY.md
          npm run format:check
          git diff --check
      - name: Typecheck, lint and real E3/E4 source suites
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint
          npx --no-install vitest run tests/ui/national/NationalPrivateCapabilityClass5.test.ts tests/ui/national/NationalPrivatePanelClass5.test.ts tests/ui/national/NationalPoliticalControlsR11.test.ts tests/ui/national/NationalDiplomacyState.test.ts tests/national/NationalAccessionPacketsR11.test.ts tests/ui/national/NationalHumanMapInputR11.test.ts
      - name: Commit pinned output and remove one-time validation workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/class5-e4-private-ui-verify-once.yml
          git add src/client/Transport.ts src/client/NationalDiplomacyPanel.ts src/client/NationalDiplomacyState.ts src/client/hud/layers/GameRightSidebar.ts src/client/NationalPrivateCapability.ts tests/ui/national/NationalPrivateCapabilityClass5.test.ts tests/ui/national/NationalPrivatePanelClass5.test.ts docs/release/NATIONAL_CLASS5_E4_PRIVATE_HUMAN_JOURNEY.md
          git diff --cached --check
          git commit -m "feat(national): verify pinned trusted Private UI and exact-seat negative gates"
          git push origin HEAD:refs/heads/feature/class5-e4-private-national-ui-20261121
