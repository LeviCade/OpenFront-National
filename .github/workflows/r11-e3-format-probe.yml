name: R11 E3 independent combined recipient contract probe
on:
  push:
    branches:
      - probe/r11-e3-oxfmt-20261121
    paths:
      - .github/workflows/r11-e3-format-probe.yml
permissions:
  contents: read
jobs:
  authentic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Pinned npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Pinned install
        run: npm run inst
      - name: E1 E2 E3 E4 typed integration
        run: npm run typecheck
      - name: Exact R11 recipient UI and live bot tests (no GPU)
        run: npx --no-install vitest run --project node tests/national/NationalAccessionPacketsR11.test.ts tests/national/RoundElevenDelegatedPeaceWire.test.ts tests/national/NationalBotRejectionRoundtripR11.test.ts
