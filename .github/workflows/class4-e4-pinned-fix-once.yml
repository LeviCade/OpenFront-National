name: Class Four E4 one-time pinned formatter and reciprocal tests
on:
  push:
    branches:
      - feature/class4-e4-reciprocal-ui-20261121
permissions:
  contents: write
jobs:
  reciprocal-e4:
    name: Pinned full-file format and reciprocal tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci --ignore-scripts
      - name: Pinned oxfmt on complete test and document
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install oxfmt --write tests/ui/national/NationalPoliticalControlsR11.test.ts docs/release/NATIONAL_R11_E4_CLASS3_PLAYER_JOURNEY.md
          npx --no-install oxfmt --check tests/ui/national/NationalPoliticalControlsR11.test.ts docs/release/NATIONAL_R11_E4_CLASS3_PLAYER_JOURNEY.md
          git diff --check
      - name: Typecheck and E3/E4 source tests
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npx --no-install vitest run tests/national/NationalAccessionPacketsR11.test.ts tests/ui/national/NationalPoliticalControlsR11.test.ts tests/ui/national/NationalHumanMapInputR11.test.ts tests/ui/national/NationalDiplomacyPanel.test.ts
      - name: Commit exact oxfmt output and delete one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/class4-e4-pinned-fix-once.yml
          git add tests/ui/national/NationalPoliticalControlsR11.test.ts docs/release/NATIONAL_R11_E4_CLASS3_PLAYER_JOURNEY.md
          git diff --cached --check
          git commit -m "fix(national): pin-format reciprocal UI and player journey"
          git push origin HEAD:refs/heads/feature/class4-e4-reciprocal-ui-20261121
