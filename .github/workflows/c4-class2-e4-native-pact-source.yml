name: C4 E4 — native pact and imperial source gate

on:
  push:
    branches:
      - stage3/conductor4-class2-integration-20261122
      - stage3/conductor5-class1-integration-20261122
  pull_request:
    branches:
      - stage3/conductor4-class2-integration-20261122
      - stage3/conductor5-class1-integration-20261122
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c4-e4-native-pact-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Exact native pact, privacy, receipt and transport source tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NATIONAL_C4_REQUIRE_PACT_READ: ${{ (github.ref == 'refs/heads/stage3/conductor4-class2-integration-20261122' || github.ref == 'refs/heads/stage3/conductor5-class1-integration-20261122') && '1' || '0' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
      - name: Verify exact source and mode
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'SOURCE_SHA=%s REQUIRE_CANONICAL=%s\n' "$EXPECTED_SHA" "$NATIONAL_C4_REQUIRE_PACT_READ"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm run inst
      - run: npm run typecheck
      - name: Real stamped host and recipient gates
        run: |
          npx --no-install vitest run --project node \
            tests/national/C4NativePactGate.test.ts \
            tests/national/C4NativeImperialGate.test.ts \
            tests/national/C4NativePactHost.test.ts \
            tests/national/C2PrivateObserverMapWire.test.ts
      - name: Ordinary native DOM and dispatch
        run: |
          npx --no-install vitest run \
            tests/client/TransportSendPaths.test.ts \
            tests/ui/national/NationalDiplomacyPanel.test.ts \
            tests/ui/national/NationalPrivatePanelClass5.test.ts \
            tests/ui/national/C4NativeObserverRevocation.test.ts \
            tests/ui/national/TrustedNationalProjectionMapC2.test.ts \
            tests/ui/national/NationalHumanMapInputR11.test.ts
